<!DOCTYPE html>
<html lang="ru" data-accent="purple" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#a78bfa" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Reps" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%23a78bfa'/%3E%3Cpath d='M64 44h40c20 0 34 12 34 30 0 13-7 23-19 27l22 47h-26l-18-42h-9v42H64V44zm24 20v22h16c7 0 12-4 12-11 0-7-5-11-12-11h-16z' fill='white'/%3E%3C/svg%3E" />
<title>Reps</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root, [data-theme="dark"] {
    --bg: #0f0f10; --bg-card: #1a1a1c; --bg-card-hover: #26262a;
    --bg-input: #26262a; --bg-input-focus: #2f2f33; --border: #26262a;
    --text: #ffffff; --text-muted: #8a8a92;
    --green: #22c55e; --red: #ff6b6b; --orange: #ff9e3d;
    --card-bg: linear-gradient(160deg, #1a1530 0%, #0f0f10 100%);
    --card-text: #ffffff;
    --card-text-muted: #8a8a92;
    --card-cell-bg: rgba(255,255,255,0.03);
  }
  [data-theme="dim"] {
    --bg: #1e1e24; --bg-card: #292930; --bg-card-hover: #33333b;
    --bg-input: #33333b; --bg-input-focus: #3d3d46; --border: #33333b;
    --text: #ececf1; --text-muted: #9a9aa5;
    --green: #4ade80; --red: #f87171; --orange: #fbbf24;
    --card-bg: linear-gradient(160deg, #2a2540 0%, #1e1e24 100%);
    --card-text: #ececf1;
    --card-text-muted: #9a9aa5;
    --card-cell-bg: rgba(255,255,255,0.05);
  }
  [data-theme="light"] {
    --bg: #f4f4f6; --bg-card: #ffffff; --bg-card-hover: #f0f0f3;
    --bg-input: #f0f0f3; --bg-input-focus: #e5e5ea; --border: #e0e0e5;
    --text: #111114; --text-muted: #6b6b75;
    --green: #16a34a; --red: #dc2626; --orange: #ea8a2b;
    --card-bg: linear-gradient(160deg, #f0edff 0%, #ffffff 100%);
    --card-text: #111114;
    --card-text-muted: #6b6b75;
    --card-cell-bg: rgba(0,0,0,0.03);
  }

  /* ============ АКЦЕНТНЫЕ ЦВЕТА (мягкие, пастельные) ============ */
  [data-accent="purple"] { --accent: #a78bfa; --accent-soft: rgba(167,139,250,0.16); --accent-light: #c4b5fd; --accent-secondary: #8b6fe8; }
  [data-accent="indigo"] { --accent: #818cf8; --accent-soft: rgba(129,140,248,0.16); --accent-light: #a5b4fc; --accent-secondary: #6366f1; }
  [data-accent="blue"]   { --accent: #7dd3fc; --accent-soft: rgba(125,211,252,0.16); --accent-light: #bae6fd; --accent-secondary: #38bdf8; }
  [data-accent="teal"]   { --accent: #5eead4; --accent-soft: rgba(94,234,212,0.16);  --accent-light: #99f6e4; --accent-secondary: #2dd4bf; }
  [data-accent="mint"]   { --accent: #86efac; --accent-soft: rgba(134,239,172,0.16); --accent-light: #bbf7d0; --accent-secondary: #4ade80; }
  [data-accent="green"]  { --accent: #6ee7b7; --accent-soft: rgba(110,231,183,0.16); --accent-light: #a7f3d0; --accent-secondary: #34d399; }
  [data-accent="lime"]   { --accent: #bef264; --accent-soft: rgba(190,242,100,0.18); --accent-light: #d9f99d; --accent-secondary: #a3e635; }
  [data-accent="yellow"] { --accent: #fde68a; --accent-soft: rgba(253,230,138,0.18); --accent-light: #fef3c7; --accent-secondary: #fcd34d; }
  [data-accent="orange"] { --accent: #fdba74; --accent-soft: rgba(253,186,116,0.16); --accent-light: #fed7aa; --accent-secondary: #fb923c; }
  [data-accent="coral"]  { --accent: #fca5a5; --accent-soft: rgba(252,165,165,0.16); --accent-light: #fecaca; --accent-secondary: #f87171; }
  [data-accent="pink"]   { --accent: #f9a8d4; --accent-soft: rgba(249,168,212,0.16); --accent-light: #fbcfe8; --accent-secondary: #f472b6; }
  [data-accent="rose"]   { --accent: #f0abfc; --accent-soft: rgba(240,171,252,0.16); --accent-light: #f5d0fe; --accent-secondary: #e879f9; }

  [data-theme="dark"][data-accent="purple"] { --accent-secondary: #8b6fe8; }
  [data-theme="dark"][data-accent="indigo"] { --accent-secondary: #6366f1; }
  [data-theme="dark"][data-accent="blue"]   { --accent-secondary: #38bdf8; }
  [data-theme="dark"][data-accent="teal"]   { --accent-secondary: #2dd4bf; }
  [data-theme="dark"][data-accent="mint"]   { --accent-secondary: #4ade80; }
  [data-theme="dark"][data-accent="green"]  { --accent-secondary: #34d399; }
  [data-theme="dark"][data-accent="lime"]   { --accent-secondary: #a3e635; }
  [data-theme="dark"][data-accent="yellow"] { --accent-secondary: #fcd34d; }
  [data-theme="dark"][data-accent="orange"] { --accent-secondary: #fb923c; }
  [data-theme="dark"][data-accent="coral"]  { --accent-secondary: #f87171; }
  [data-theme="dark"][data-accent="pink"]   { --accent-secondary: #f472b6; }
  [data-theme="dark"][data-accent="rose"]   { --accent-secondary: #e879f9; }

  [data-theme="light"][data-accent="purple"] { --accent: #8b5cf6; --accent-light: #7c3aed; --accent-secondary: #7c3aed; --accent-soft: rgba(139,92,246,0.14); }
  [data-theme="light"][data-accent="indigo"] { --accent: #6366f1; --accent-light: #4f46e5; --accent-secondary: #4f46e5; --accent-soft: rgba(99,102,241,0.14); }
  [data-theme="light"][data-accent="blue"]   { --accent: #0ea5e9; --accent-light: #0284c7; --accent-secondary: #0284c7; --accent-soft: rgba(14,165,233,0.14); }
  [data-theme="light"][data-accent="teal"]   { --accent: #14b8a6; --accent-light: #0d9488; --accent-secondary: #0d9488; --accent-soft: rgba(20,184,166,0.14); }
  [data-theme="light"][data-accent="mint"]   { --accent: #22c55e; --accent-light: #16a34a; --accent-secondary: #16a34a; --accent-soft: rgba(34,197,94,0.14); }
  [data-theme="light"][data-accent="green"]  { --accent: #10b981; --accent-light: #059669; --accent-secondary: #059669; --accent-soft: rgba(16,185,129,0.14); }
  [data-theme="light"][data-accent="lime"]   { --accent: #84cc16; --accent-light: #65a30d; --accent-secondary: #65a30d; --accent-soft: rgba(132,204,22,0.14); }
  [data-theme="light"][data-accent="yellow"] { --accent: #eab308; --accent-light: #ca8a04; --accent-secondary: #ca8a04; --accent-soft: rgba(234,179,8,0.16); }
  [data-theme="light"][data-accent="orange"] { --accent: #f97316; --accent-light: #ea580c; --accent-secondary: #ea580c; --accent-soft: rgba(249,115,22,0.14); }
  [data-theme="light"][data-accent="coral"]  { --accent: #ef4444; --accent-light: #dc2626; --accent-secondary: #dc2626; --accent-soft: rgba(239,68,68,0.14); }
  [data-theme="light"][data-accent="pink"]   { --accent: #ec4899; --accent-light: #db2777; --accent-secondary: #db2777; --accent-soft: rgba(236,72,153,0.14); }
  [data-theme="light"][data-accent="rose"]   { --accent: #d946ef; --accent-light: #c026d3; --accent-secondary: #c026d3; --accent-soft: rgba(217,70,239,0.14); }

  [data-theme="dim"][data-accent="purple"] { --accent: #9d7ff5; --accent-light: #b8a1ff; --accent-secondary: #8563e0; }
  [data-theme="dim"][data-accent="indigo"] { --accent: #7382f0; --accent-light: #94a1f7; --accent-secondary: #5b67d9; }
  [data-theme="dim"][data-accent="blue"]   { --accent: #6fc4ec; --accent-light: #9dd6f3; --accent-secondary: #4ea9d5; }
  [data-theme="dim"][data-accent="teal"]   { --accent: #55d9c4; --accent-light: #85e6d5; --accent-secondary: #3bbda9; }
  [data-theme="dim"][data-accent="mint"]   { --accent: #79dd9f; --accent-light: #a2e9be; --accent-secondary: #5cc582; }
  [data-theme="dim"][data-accent="green"]  { --accent: #62d6a8; --accent-light: #8ee4c1; --accent-secondary: #44bf8d; }
  [data-theme="dim"][data-accent="lime"]   { --accent: #b0dd5f; --accent-light: #c8e88a; --accent-secondary: #93c344; }
  [data-theme="dim"][data-accent="yellow"] { --accent: #edd57f; --accent-light: #f3e2a6; --accent-secondary: #d4ba5e; }
  [data-theme="dim"][data-accent="orange"] { --accent: #eeaa6b; --accent-light: #f4c398; --accent-secondary: #d68f4d; }
  [data-theme="dim"][data-accent="coral"]  { --accent: #ea9797; --accent-light: #f0b5b5; --accent-secondary: #d47b7b; }
  [data-theme="dim"][data-accent="pink"]   { --accent: #e99bc7; --accent-light: #f0b8d7; --accent-secondary: #d47bab; }
  [data-theme="dim"][data-accent="rose"]   { --accent: #e19ce8; --accent-light: #ecb9f0; --accent-secondary: #c97dd1; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--text); font-family: 'Inter', system-ui, sans-serif; overscroll-behavior: none; transition: background 0.2s, color 0.2s; }

  .container { min-height: 100vh; padding: 24px 0 220px; padding-bottom: calc(220px + env(safe-area-inset-bottom, 0px)); }

  .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: -4px; flex-shrink: 0; }
  .icon-sm { width: 16px; height: 16px; }
  .icon-lg { width: 44px; height: 44px; stroke-width: 1.5; }

  .top-tabs { display: flex; gap: 6px; padding: 0 20px 20px; justify-content: center; }
  .top-tab { flex: 1; max-width: 140px; background: var(--bg-card); color: var(--text-muted); border: none; border-radius: 12px; padding: 12px 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .top-tab.active { background: var(--accent); color: #fff; }
  .tabs { display: flex; gap: 6px; padding: 0 20px 16px; justify-content: flex-end; flex-wrap: wrap; }
  .tab-btn { background: var(--bg-card); color: var(--text-muted); border: none; border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 5px; }

  .timer-bar-wrap { position: sticky; top: 0; z-index: 50; padding: 8px 0 12px; background: linear-gradient(to bottom, var(--bg) 60%, transparent); margin: 0 0 8px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
  .timer-bar { margin: 0 20px; background: linear-gradient(135deg, var(--accent), var(--accent-secondary)); border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 24px var(--accent-soft); color: #fff; }
  .timer-icon { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; color: #fff; animation: pulse 2s ease-in-out infinite; }
  .timer-icon svg { stroke: #fff; fill: none; stroke-width: 1.8; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  .timer-info { flex: 1; min-width: 0; }
  .timer-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.85; margin-bottom: 2px; }
  .timer-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
  .timer-stop { background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 5px; }

  .calendar-nav { display: flex; align-items: center; gap: 8px; padding: 0 20px 12px; }
  .cal-nav-btn { width: 36px; height: 36px; background: var(--bg-card); color: var(--text); border: none; border-radius: 10px; font-size: 18px; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .cal-range { flex: 1; text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 500; }
  .calendar { display: flex; gap: 6px; padding: 0 20px 20px; overflow-x: auto; scrollbar-width: none; }
  .calendar::-webkit-scrollbar { display: none; }
  .day { flex-shrink: 0; width: 52px; padding: 12px 0; border-radius: 14px; background: var(--bg-card); text-align: center; cursor: pointer; transition: background 0.15s; color: var(--text); }
  .day.active { background: var(--accent); }
  .day .wd { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
  .day.active .wd { color: rgba(255,255,255,0.8); }
  .day .num { font-size: 18px; font-weight: 600; }
  .day .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin: 6px auto 0; opacity: 0; }
  .day.active .dot { background: #fff; }
  .day.today .num { color: var(--accent); }
  .day.active .num { color: #fff; }

  .page-title { padding: 0 20px 4px; font-size: 26px; font-weight: 700; color: var(--text); }
  .page-date { padding: 0 20px 16px; color: var(--text-muted); font-size: 14px; text-transform: capitalize; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-icon { width: 44px; height: 44px; stroke: var(--text-muted); stroke-width: 1.5; fill: none; margin-bottom: 12px; opacity: 0.4; }
  .empty-hint { font-size: 14px; margin-top: 6px; opacity: 0.7; }

  .exercises { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
  .exercise-card { background: var(--bg-card); border-radius: 16px; padding: 16px; position: relative; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s; }
  .exercise-card.superset { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }

  .exercise-head { display: flex; align-items: flex-start; margin-bottom: 12px; gap: 4px; }
  .exercise-name { font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text); flex: 1; min-width: 0; }
  .exercise-name .chart-hint { color: var(--text-muted); display: inline-flex; padding: 4px; }
  .exercise-tonnage { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-right: 4px; align-self: center; }
  .exercise-type-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-light); text-transform: uppercase; letter-spacing: 0.5px; margin-left: 6px; }
  .superset-label { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--accent); color: #fff; margin-right: 6px; font-variant-numeric: tabular-nums; }

  .collapse-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .collapse-btn svg { transition: transform 0.25s; }
  .collapse-btn.collapsed svg { transform: rotate(-90deg); }

  .rest-timer { display: flex; align-items: center; gap: 8px; padding: 6px 12px; margin: 2px 0 8px 32px; background: var(--accent-soft); border-radius: 10px; color: var(--accent-light); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; animation: restIn 0.3s ease-out; }
  @keyframes restIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .rest-timer.done { background: rgba(34,197,94,0.15); color: var(--green); }

  .set-row { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border-radius: 10px; padding: 4px 0; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; touch-action: pan-y; will-change: transform; margin-bottom: 8px; }
  .set-num { color: var(--text-muted); font-size: 13px; width: 24px; text-align: center; }
  .set-row input { background: var(--bg-input); border: none; border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 15px; font-family: inherit; outline: none; flex: 1; text-align: center; min-width: 0; }
  .set-row input:focus { background: var(--bg-input-focus); }
  .times { color: var(--text-muted); font-size: 13px; }
  .icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; display: inline-flex; align-items: center; justify-content: center; }
  .link-btn { background: transparent; border: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 0; font-family: inherit; display: flex; align-items: center; gap: 6px; }
  .prev-hint { font-size: 11px; color: var(--text-muted); margin-top: -4px; margin-bottom: 8px; padding-left: 32px; }

  .bottom-bar { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 10px; width: calc(100% - 40px); max-width: 520px; z-index: 10; }
  .bottom-bar::before { content: ''; position: absolute; inset: -40px -20px -20px -20px; background: linear-gradient(to top, var(--bg) 50%, transparent); pointer-events: none; z-index: -1; }
  .bar-btn { flex: 1 1 0; min-width: 0; border: none; border-radius: 16px; padding: 18px 16px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; white-space: nowrap; transition: transform 0.1s; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .bar-btn:active { transform: scale(0.97); }
  .bar-btn.add { background: var(--accent); color: #fff; box-shadow: 0 8px 24px var(--accent-soft); }
  .bar-btn.start { background: var(--accent-secondary); color: #fff; box-shadow: 0 8px 24px var(--accent-soft); }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(8px); }
  .modal-bg.center-mode { align-items: center; padding: 20px; }
  .modal { background: var(--bg); border-radius: 24px 24px 0 0; width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; padding: 20px 20px 40px; transition: transform 0.2s; color: var(--text); }
  .modal.center { border-radius: 24px; margin: auto; max-width: 420px; align-self: center; padding: 24px; }
  .handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; touch-action: none; }
  .modal h2 { font-size: 20px; font-weight: 700; margin: 0 0 16px; color: var(--text); }
  .search-input { background: var(--bg-card); border: none; border-radius: 12px; padding: 14px 16px; color: var(--text); font-size: 16px; font-family: inherit; outline: none; width: 100%; margin-bottom: 16px; }
  .section-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; margin-top: 4px; font-weight: 500; }

  .category-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); border: none; border-radius: 14px; padding: 16px; color: var(--text); font-size: 15px; font-weight: 500; font-family: inherit; cursor: pointer; width: 100%; margin-bottom: 8px; text-align: left; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); touch-action: pan-y; will-change: transform; }
  .category-item .count { color: var(--text-muted); font-size: 13px; font-weight: 400; display: flex; align-items: center; gap: 8px; }

  .ex-item { background: var(--bg-card); border-radius: 12px; padding: 4px 4px 4px 14px; display: flex; align-items: center; gap: 4px; margin-bottom: 6px; transition: background 0.15s, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); touch-action: pan-y; will-change: transform; }
  .ex-item.selected { background: var(--accent-soft); border: 1px solid var(--accent); }
  .ex-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; color: transparent; flex-shrink: 0; transition: all 0.15s; }
  .ex-check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ex-name-btn { background: transparent; border: none; color: var(--text); font-size: 15px; font-family: inherit; cursor: pointer; text-align: left; flex: 1; padding: 12px 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

function Icon({ name, className = '' }) {
  const el = Icons[name];
  if (!el) return null;
  if (!className) return el;
  return React.cloneElement(el, { className: `icon ${className}` });
}

/* ============ ЕДИНИЦЫ ============ */
const KG_TO_LB = 2.20462;
const KM_TO_MI = 0.621371;
function displayWeight(kg, units) { return units === 'imperial' ? kg * KG_TO_LB : kg; }
function displayDistance(km, units) { return units === 'imperial' ? km * KM_TO_MI : km; }
function inputToKg(value, units) { return units === 'imperial' ? value / KG_TO_LB : value; }
function inputToKm(value, units) { return units === 'imperial' ? value / KM_TO_MI : value; }
function distanceUnit(units) { return units === 'imperial' ? 'миль' : 'км'; }
function calc1RM(weight, reps) {
  if (!weight || !reps) return 0;
  return weight * (1 + reps / 30);
}

/* ============ ДАТЫ И ФОРМАТ ============ */
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function getWeek(offset) {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i + offset * 7);
    days.push(d);
  }
  return days;
}
function parseDateKey(key) { return new Date(key + 'T00:00:00'); }
function fmtNum(n, lang) {
  if (typeof n !== 'number' || isNaN(n)) return '0';
  if (!lang) {
    try {
      const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
      lang = s.language || 'ru';
    } catch { lang = 'ru'; }
  }
  const rounded = Math.round(n * 10) / 10;
  const locale = lang === 'en' ? 'en-US' : 'ru-RU';
  return rounded.toLocaleString(locale, { maximumFractionDigits: 1 });
}
function fmtDuration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h} ч ${m} мин`;
  if (m > 0) return `${m} мин ${s} сек`;
  return `${s} сек`;
}
function fmtTimer(seconds) {
  const sec = Math.max(0, Math.floor(seconds || 0));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function setTonnage(s) { return (Number(s.weight) || 0) * (Number(s.reps) || 0); }
function exerciseTonnage(ex) {
  if (ex.type === EX_TYPE.STRENGTH) return ex.sets.reduce((sum, s) => sum + setTonnage(s), 0);
  return 0;
}
function workoutTonnage(exercises) { return exercises.reduce((sum, ex) => sum + exerciseTonnage(ex), 0); }
function totalSets(exercises) { return exercises.reduce((sum, ex) => sum + ex.sets.length, 0); }
function getMuscleGroups(exercises, catalog) {
  const groups = new Set();
  exercises.forEach(ex => {
    catalog.forEach(cat => { if (cat.exercises.includes(ex.name)) groups.add(cat.id); });
  });
  return Array.from(groups);
}
function vibrate(pattern, enabled) {
  if (!enabled) return;
  if ('vibrate' in navigator) { try { navigator.vibrate(pattern); } catch (e) {} }
}
const VIBRATE_LIGHT = 15;
const VIBRATE_MEDIUM = 30;
const VIBRATE_STRONG = [40, 30, 40];

/* ============ ХУКИ СВАЙПОВ ============ */
function useSwipeDown(onClose) {
  const ref = useRef(null);
  const startY = useRef(null);
  const currentY = useRef(null);
  const isDragging = useRef(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    function onTouchStart(e) {
      const rect = el.getBoundingClientRect();
      const y = e.touches[0].clientY;
      if (y - rect.top > 80) return;
      if (el.scrollTop > 0) return;
      startY.current = y; currentY.current = y;
      isDragging.current = false;
      el.style.transition = 'none';
    }
    function onTouchMove(e) {
      if (startY.current == null) return;
      currentY.current = e.touches[0].clientY;
      const dy = currentY.current - startY.current;
      if (!isDragging.current && dy > 5) isDragging.current = true;
      if (isDragging.current && dy > 0) el.style.transform = `translateY(${dy}px)`;
    }
    function onTouchEnd() {
      if (startY.current == null) return;
      const dy = currentY.current - startY.current;
      el.style.transition = 'transform 0.2s';
      if (isDragging.current && dy > 100) {
        el.style.transform = 'translateY(100%)';
        setTimeout(onClose, 150);
      } else {
        el.style.transform = 'translateY(0)';
      }
      startY.current = null; currentY.current = null; isDragging.current = false;
    }
    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove', onTouchMove, { passive: true });
    el.addEventListener('touchend', onTouchEnd);
    return () => {
      el.removeEventListener('touchstart', onTouchStart);
      el.removeEventListener('touchmove', onTouchMove);
      el.removeEventListener('touchend', onTouchEnd);
    };
  }, [onClose]);
  return ref;
}

function useSwipeLeft(onDelete) {
  const ref = useRef(null);
  const startX = useRef(null);
  const startY = useRef(null);
  const isDragging = useRef(false);
  const AUTO_DELETE = 140;

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    function onTouchStart(e) {
      startX.current = e.touches[0].clientX;
      startY.current = e.touches[0].clientY;
      isDragging.current = false;
      el.style.transition = 'none';
    }
    function onTouchMove(e) {
      if (startX.current == null) return;
      const dx = e.touches[0].clientX - startX.current;
      const dy = e.touches[0].clientY - startY.current;
      if (!isDragging.current && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        isDragging.current = true;
      }
      if (isDragging.current) {
        e.stopPropagation();
        const clamped = Math.max(-AUTO_DELETE, Math.min(0, dx));
        el.style.transform = `translateX(${clamped}px)`;
      }
    }
    function onTouchEnd(e) {
      if (!isDragging.current) { startX.current = null; return; }
      e.stopPropagation();
      const transform = el.style.transform;
      const match = transform.match(/translateX\((-?\d+(?:\.\d+)?)px\)/);
      const tx = match ? parseFloat(match[1]) : 0;
      el.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
      el.style.transform = 'translateX(0)';
      if (tx <= -AUTO_DELETE * 0.6) {
        setTimeout(() => onDelete(), 100);
      }
      startX.current = null;
      isDragging.current = false;
    }
    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove', onTouchMove, { passive: true });
    el.addEventListener('touchend', onTouchEnd);
    return () => {
      el.removeEventListener('touchstart', onTouchStart);
      el.removeEventListener('touchmove', onTouchMove);
      el.removeEventListener('touchend', onTouchEnd);
    };
  }, [onDelete]);
  return ref;
}

function useLongPressDrag(items, onReorder) {
  const [draggingId, setDraggingId] = useState(null);
  const [dragOverIndex, setDragOverIndex] = useState(null);
  const timerRef = useRef(null);
  const startIndexRef = useRef(null);
  const startPosRef = useRef(null);
  const itemRectsRef = useRef([]);
  const draggingIdRef = useRef(null);
  const currentOverIndexRef = useRef(null);

  function getHandleHandlers(item, index) {
    const itemId = typeof item === 'object' ? (item.id || item.name || item.key) : item;
    return {
      onTouchStart: (e) => {
        e.stopPropagation();
        startPosRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        startIndexRef.current = index;
        currentOverIndexRef.current = index;
        timerRef.current = setTimeout(() => {
          if (!startPosRef.current) return;
          if ('vibrate' in navigator) { try { navigator.vibrate(VIBRATE_LIGHT); } catch {} }
          setDraggingId(itemId);
          draggingIdRef.current = itemId;
          setDragOverIndex(index);
          requestAnimationFrame(() => {
            const all = document.querySelectorAll('[data-drag-id]');
            itemRectsRef.current = Array.from(all).map(el => ({
              id: el.getAttribute('data-drag-id'),
              rect: el.getBoundingClientRect(),
            }));
          });
        }, 350);
      },
      onTouchMove: (e) => {
        e.stopPropagation();
        if (timerRef.current && startPosRef.current && draggingIdRef.current == null) {
          const dx = e.touches[0].clientX - startPosRef.current.x;
          const dy = e.touches[0].clientY - startPosRef.current.y;
          if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
            clearTimeout(timerRef.current);
            timerRef.current = null;
            startPosRef.current = null;
          }
        }
        if (draggingIdRef.current == null) return;
        e.preventDefault();
        const y = e.touches[0].clientY;
        let targetIdx = null;
        itemRectsRef.current.forEach((item, idx) => {
          const r = item.rect;
          if (y >= r.top && y <= r.bottom) targetIdx = idx;
        });
        if (itemRectsRef.current.length > 0) {
          if (y < itemRectsRef.current[0].rect.top) targetIdx = 0;
          if (y > itemRectsRef.current[itemRectsRef.current.length - 1].rect.bottom)
            targetIdx = itemRectsRef.current.length - 1;
        }
        if (targetIdx != null) {
          setDragOverIndex(targetIdx);
          currentOverIndexRef.current = targetIdx;
        }
      },
      onTouchEnd: (e) => {
        e.stopPropagation();
        if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
        if (draggingIdRef.current != null && currentOverIndexRef.current != null && currentOverIndexRef.current !== startIndexRef.current) {
          onReorder(startIndexRef.current, currentOverIndexRef.current);
        }
        setDraggingId(null); setDragOverIndex(null);
        draggingIdRef.current = null;
        startPosRef.current = null;
        currentOverIndexRef.current = null;
      },
    };
  }
  return { draggingId, dragOverIndex, getHandleHandlers };
}

function useRestTimer(settings) {
  const [restState, setRestState] = useState(null);

  useEffect(() => {
    if (!restState) return;
    const int = setInterval(() => {
      const remaining = Math.max(0, Math.ceil((restState.endedAt - Date.now()) / 1000));
      if (remaining <= 0 && !restState.done) {
        vibrate([100, 80, 100], settings.vibration);
        playRestDoneSound(settings.restSoundEnabled);
        setRestState(prev => prev ? { ...prev, done: true, endedAt: Date.now() + 3000 } : null);
      }
    }, 500);
    return () => clearInterval(int);
  }, [restState, settings.vibration, settings.restSoundEnabled]);

  function startRest(exerciseId, setId) {
    if (!settings.restTimerEnabled) return;
    const duration = settings.restDuration || 120;
    setRestState(prev => {
      if (prev && prev.setId === setId && !prev.done) {
        return prev;
      }
      return {
        endedAt: Date.now() + duration * 1000,
        total: duration,
        exerciseId, setId,
        done: false,
      };
    });
  }

  function skipRest() {
    setRestState(null);
  }

  function getRemaining() {
    if (!restState) return 0;
    return Math.max(0, Math.ceil((restState.endedAt - Date.now()) / 1000));
  }

  return { restState, startRest, skipRest, getRemaining };
}

/* ============ ГЛАВНЫЙ APP ============ */
function App() {
  const [tab, setTab] = useState('workouts');
  const [settings, setSettings] = useState({
    theme: 'dark', language: 'ru', units: 'metric',
    vibration: true, accent: 'purple',
    restTimerEnabled: true, restDuration: 120, restSoundEnabled: true,
  });
  const [measureFields, setMeasureFields] = useState(DEFAULT_MEASURE_FIELDS);

  useEffect(() => {
    const s = localStorage.getItem(SETTINGS_KEY);
    if (s) try { setSettings(prev => ({ ...prev, ...JSON.parse(s) })); } catch {}
    const mf = localStorage.getItem(MEASURE_FIELDS_KEY);
    if (mf) try { setMeasureFields(JSON.parse(mf)); } catch {}
  }, []);
  useEffect(() => { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }, [settings]);
  useEffect(() => { localStorage.setItem(MEASURE_FIELDS_KEY, JSON.stringify(measureFields)); }, [measureFields]);
  useEffect(() => {
    const root = document.documentElement;
    let actualTheme = settings.theme;
    if (settings.theme === 'auto') {
      actualTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    root.setAttribute('data-theme', actualTheme);
    root.setAttribute('data-accent', settings.accent || 'purple');
    const accentColors = {
      purple: '#a78bfa', indigo: '#818cf8', blue: '#7dd3fc',
      teal: '#5eead4', mint: '#86efac', green: '#6ee7b7',
      lime: '#bef264', yellow: '#fde68a', orange: '#fdba74',
      coral: '#fca5a5', pink: '#f9a8d4', rose: '#f0abfc',
    };
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute('content', accentColors[settings.accent] || '#a78bfa');
  }, [settings.theme, settings.accent]);
  useEffect(() => {
    if (settings.theme !== 'auto') return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    function handler() {
      const actualTheme = mq.matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', actualTheme);
    }
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, [settings.theme]);

  return (
    <SettingsContext.Provider value={{ settings, setSettings, measureFields, setMeasureFields }}>
      <div className="container">
        <div className="top-tabs">
          <button className={`top-tab ${tab === 'workouts' ? 'active' : ''}`}
            onClick={() => setTab('workouts')}>
            <Icon name="dumbbell" /> {settings.language === 'en' ? 'Workouts' : 'Тренировки'}
          </button>
          <button className={`top-tab ${tab === 'measures' ? 'active' : ''}`}
            onClick={() => setTab('measures')}>
            <Icon name="ruler" /> {settings.language === 'en' ? 'Measures' : 'Замеры'}
          </button>
          <button className={`top-tab ${tab === 'settings' ? 'active' : ''}`}
            onClick={() => setTab('settings')}>
            <Icon name="settings" /> {settings.language === 'en' ? 'Settings' : 'Настройки'}
          </button>
        </div>
        {tab === 'workouts' && <WorkoutsTab />}
        {tab === 'measures' && <MeasuresTab />}
        {tab === 'settings' && <SettingsTab />}
      </div>
    </SettingsContext.Provider>
  );
}

/* ============ ОТЧЁТ ДЛЯ ТРЕНЕРА ============ */
function buildWorkoutReportText(data, exercises, settings, t, catalog) {
  const units = settings.units;
  const isRu = settings.language !== 'en';
  const dateObj = parseDateKey(data.date);

  const dateStr = dateObj.toLocaleDateString(isRu ? 'ru-RU' : 'en-US',
    { day: 'numeric', month: 'long', year: 'numeric' });
  const wdStr = dateObj.toLocaleDateString(isRu ? 'ru-RU' : 'en-US', { weekday: 'long' });

  const lines = [];
  const sep = '─'.repeat(40);

  lines.push(isRu ? 'Reps — Отчёт о тренировке' : 'Reps — Workout report');
  lines.push('='.repeat(40));
  lines.push('');
  lines.push(`${isRu ? 'Дата' : 'Date'}: ${dateStr} (${wdStr})${data.startTime ? ', ' + data.startTime : ''}`);
  if (data.duration > 0) {
    lines.push(`${isRu ? 'Длительность' : 'Duration'}: ${fmtDuration(data.duration)}`);
  }

  const tonnage = workoutTonnage(exercises);
  if (tonnage > 0) {
    lines.push(`${isRu ? 'Тоннаж' : 'Volume'}: ${fmtNum(tonnage)} ${isRu ? 'кг' : 'kg'}`);
  }

  const sets = totalSets(exercises);
  lines.push(`${isRu ? 'Упражнений' : 'Exercises'}: ${exercises.length} · ${isRu ? 'Подходов' : 'Sets'}: ${sets}`);

  const muscles = getMuscleGroups(exercises, catalog || []);
  if (muscles.length > 0) {
    const names = muscles.map(id => {
      const cat = (catalog || []).find(c => c.id === id);
      return cat ? translateExercise(cat.name, settings.language) : id;
    });
    lines.push(`${isRu ? 'Группы мышц' : 'Muscle groups'}: ${names.join(', ')}`);
  }

  lines.push('');
  lines.push(sep);
  lines.push('');

  let num = 0;
  exercises.forEach(ex => {
    const validSets = ex.sets.filter(s =>
      (Number(s.weight) || 0) > 0 || (Number(s.reps) || 0) > 0 ||
      (Number(s.min) || 0) > 0 || (Number(s.km) || 0) > 0 ||
      (Number(s.sec) || 0) > 0
    );
    if (validSets.length === 0) return;
    num++;

    const exName = translateExercise(ex.name, settings.language);
    lines.push(`${num}. ${exName}`);

    validSets.forEach((s, i) => {
      let setStr = '';
      if (ex.type === EX_TYPE.STRENGTH) {
        const w = displayWeight(Number(s.weight) || 0, units);
        const r = Number(s.reps) || 0;
        setStr = `${fmtNum(w)} ${isRu ? 'кг' : 'kg'} × ${r}`;
      } else if (ex.type === EX_TYPE.CARDIO) {
        const m = Number(s.min) || 0;
        const km = displayDistance(Number(s.km) || 0, units);
        setStr = `${m} ${isRu ? 'мин' : 'min'} × ${fmtNum(km)} ${isRu ? 'км' : 'km'}`;
      } else if (ex.type === EX_TYPE.TIME) {
        setStr = `${Number(s.sec) || 0} ${isRu ? 'сек' : 'sec'}`;
      }
      const label = isRu ? 'Подход' : 'Set';
      lines.push(`   ${label} ${i + 1}: ${setStr}`);
    });
    lines.push('');
  });

  lines.push(sep);
  lines.push(isRu ? 'Сгенерировано в Reps' : 'Generated by Reps');

  return lines.join('\n');
}

function downloadTextFile(text, filename) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function shareText(text, title = 'Reps — Workout report') {
  if (navigator.share) {
    try {
      await navigator.share({ title, text });
      return true;
    } catch (e) {
      if (e.name === 'AbortError') return true;
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    alert('Скопировано в буфер обмена');
    return true;
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); alert('Скопировано в буфер обмена'); }
    catch { alert('Не удалось скопировать'); }
    document.body.removeChild(ta);
    return false;
  }
}

/* ============ ХЕЛПЕРЫ ДЛЯ ОТЧЁТА/ШАРИНГА ============ */
function buildResultData(result, catalog, settings, t) {
  const units = settings.units;
  const startTime = new Date(result.startedAt).toLocaleTimeString(
    settings.language === 'en' ? 'en-US' : 'ru-RU', { hour: '2-digit', minute: '2-digit' });

  const exs = result.exercises || [];
  const totalKm = exs.filter(e => e.type === EX_TYPE.CARDIO)
    .reduce((s, e) => s + e.sets.reduce((a, x) => a + (Number(x.km) || 0), 0), 0);
  const totalCardioMin = exs.filter(e => e.type === EX_TYPE.CARDIO)
    .reduce((s, e) => s + e.sets.reduce((a, x) => a + (Number(x.min) || 0), 0), 0);
  const totalTimeSec = exs.filter(e => e.type === EX_TYPE.TIME)
    .reduce((s, e) => s + e.sets.reduce((a, x) => a + (Number(x.sec) || 0), 0), 0);

  const hasStrength = result.tonnage > 0;
  const mainLabel = hasStrength ? t('tonnage') : totalKm > 0 ? t('distance') : t('seconds');
  const mainIcon = hasStrength ? 'dumbbell' : totalKm > 0 ? 'run' : 'timer';
  const mainValue = hasStrength
    ? <>{fmtNum(result.tonnage)}</>
    : totalKm > 0
      ? <>{fmtNum(displayDistance(totalKm, units))}<small>{distanceUnit(units)}</small></>
      : <>{Math.round(totalTimeSec)}<small>сек</small></>;

  const muscleNames = result.muscles.map(id => {
    const cat = (result.catalog || DEFAULT_CATALOG).find(c => c.id === id);
    return cat ? translateExercise(cat.name, settings.language) : id;
  });

  return {
    date: result.date, startTime,
    duration: result.duration,
    exercisesCount: result.exercisesCount,
    sets: result.sets,
    totalCardioMin, totalTimeSec,
    mainLabel, mainIcon, mainValue,
    muscleNames,
  };
}

function buildDayShareData(date, exercises, meta, catalog, settings, t) {
  const units = settings.units;
  const duration = meta?.duration || 0;
  const startedAt = meta?.startedAt || null;
  const startTime = startedAt
    ? new Date(startedAt).toLocaleTimeString(
        settings.language === 'en' ? 'en-US' : 'ru-RU', { hour: '2-digit', minute: '2-digit' })
    : null;

  const tonnage = workoutTonnage(exercises);
  const sets = totalSets(exercises);
  const exercisesCount = exercises.length;
  const muscles = getMuscleGroups(exercises, catalog);

  const totalKm = exercises.filter(e => e.type === EX_TYPE.CARDIO)
    .reduce((s, e) => s + e.sets.reduce((a, x) => a + (Number(x.km) || 0), 0), 0);
  const totalCardioMin = exercises.filter(e => e.type === EX_TYPE.CARDIO)
    .reduce((s, e) => s + e.sets.reduce((a, x) => a + (Number(x.min) || 0), 0), 0);
  const totalTimeSec = exercises.filter(e => e.type === EX_TYPE.TIME)
    .reduce((s, e) => s + e.sets.reduce((a, x) => a + (Number(x.sec) || 0), 0), 0);

  const hasStrength = tonnage > 0;
  const mainLabel = hasStrength ? t('tonnage') : totalKm > 0 ? t('distance') : t('seconds');
  const mainIcon = hasStrength ? 'dumbbell' : totalKm > 0 ? 'run' : 'timer';
  const mainValue = hasStrength
    ? <>{fmtNum(tonnage)}</>
    : totalKm > 0
      ? <>{fmtNum(displayDistance(totalKm, units))}<small>{distanceUnit(units)}</small></>
      : <>{Math.round(totalTimeSec)}<small>сек</small></>;

  const muscleNames = muscles.map(id => {
    const cat = catalog.find(c => c.id === id);
    return cat ? translateExercise(cat.name, settings.language) : id;
  });

  return {
    date, startTime, duration,
    exercisesCount, sets,
    totalCardioMin, totalTimeSec,
    mainLabel, mainIcon, mainValue,
    muscleNames,
  };
}
