  const [templatesOpen, setTemplatesOpen] = useState(false);
  const [saveTplOpen, setSaveTplOpen] = useState(false);
  const [shareDayOpen, setShareDayOpen] = useState(false);
  const [reportOpen, setReportOpen] = useState(false);
  const [active, setActive] = useState(null);
  const [now, setNow] = useState(Date.now());
  const [result, setResult] = useState(null);
  const [actionMenu, setActionMenu] = useState(null);
  const [supersetPicker, setSupersetPicker] = useState(null);
  const [collapsed, setCollapsed] = useState({});
  const [, setTick] = useState(0);
  const scrollTargetRef = useRef(null);
  const calendarRef = useRef(null);
  const { restState, startRest, skipRest, getRemaining } = useRestTimer(settings);

  useEffect(() => {
    if (!restState) return;
    const int = setInterval(() => setTick(t => t + 1), 500);
    return () => clearInterval(int);
  }, [restState]);

  useEffect(() => {
    const w = localStorage.getItem(WORKOUTS_KEY);
    const c = localStorage.getItem(CATALOG_KEY);
    const tpl = localStorage.getItem(TEMPLATES_KEY);
    const a = localStorage.getItem(ACTIVE_KEY);
    const col = localStorage.getItem(COLLAPSED_KEY);
    if (w) try {
      const parsed = JSON.parse(w);
      const migrated = {};
      Object.keys(parsed).forEach(key => {
        const val = parsed[key];
        if (Array.isArray(val)) migrated[key] = { exercises: val, meta: null };
        else migrated[key] = val;
      });
      setWorkouts(migrated);
    } catch {}
    if (c) try { setCatalog(JSON.parse(c)); } catch {}
    if (tpl) try { setTemplates(JSON.parse(tpl)); } catch {}
    if (a) try { setActive(JSON.parse(a)); } catch {}
    if (col) try { setCollapsed(JSON.parse(col)); } catch {}
  }, []);

  useEffect(() => { localStorage.setItem(WORKOUTS_KEY, JSON.stringify(workouts)); }, [workouts]);
  useEffect(() => { localStorage.setItem(CATALOG_KEY, JSON.stringify(catalog)); }, [catalog]);
  useEffect(() => { localStorage.setItem(TEMPLATES_KEY, JSON.stringify(templates)); }, [templates]);
  useEffect(() => { localStorage.setItem(COLLAPSED_KEY, JSON.stringify(collapsed)); }, [collapsed]);
  useEffect(() => {
    if (active) localStorage.setItem(ACTIVE_KEY, JSON.stringify(active));
    else localStorage.removeItem(ACTIVE_KEY);
  }, [active]);
  useEffect(() => {
    if (!active) return;
    const int = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(int);
  }, [active]);
  useEffect(() => {
    if (!scrollTargetRef.current) return;
    const { setId } = scrollTargetRef.current;
    requestAnimationFrame(() => {
      const el = document.querySelector(`[data-set-id="${setId}"]`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const input = el.querySelector('input');
        if (input && window.innerWidth > 768) input.focus();
      }
      scrollTargetRef.current = null;
    });
  }, [workouts, selectedDate]);
  useEffect(() => {
    if (calendarRef.current) {
      calendarRef.current.scrollLeft = calendarRef.current.scrollWidth;
    }
  }, [weekOffset, selectedDate]);

  const days = getWeek(weekOffset);
  const todayKey = dateKey(new Date());
  const currentDay = workouts[selectedDate] || { exercises: [], meta: null };
  const currentWorkout = currentDay.exercises || [];
  const currentMeta = currentDay.meta || null;
  const selectedDateObj = parseDateKey(selectedDate);
  const elapsed = active ? Math.max(0, Math.floor((now - active.startedAt) / 1000)) : 0;
  const canGoForward = weekOffset < 1;

  const monthShort = settings.language === 'en'
    ? days[6].toLocaleDateString('en-US', { month: 'short' })
    : days[6].toLocaleDateString('ru-RU', { month: 'short' });
  const rangeText = `${days[0].getDate()}–${days[6].getDate()} ${monthShort}`;
  const weekdaysShort = settings.language === 'en'
    ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
    : ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];

  const dragProps = useLongPressDrag(currentWorkout, (fromIdx, toIdx) => {
    const newList = [...currentWorkout];
    const [moved] = newList.splice(fromIdx, 1);
    newList.splice(toIdx, 0, moved);
    setWorkouts({ ...workouts, [selectedDate]: { ...currentDay, exercises: newList } });
  });

  function startWorkout() {
    unlockAudio();
    vibrate(VIBRATE_MEDIUM, settings.vibration);
    const startedAt = Date.now();
    setNow(startedAt);
    setActive({ startedAt, dateKey: selectedDate });
  }
  function stopWorkout() {
    if (!active) return;
    vibrate(VIBRATE_STRONG, settings.vibration);
    const duration = Math.floor((Date.now() - active.startedAt) / 1000);
    const day = workouts[active.dateKey] || { exercises: [], meta: null };
    const exercises = day.exercises || [];
    const muscles = getMuscleGroups(exercises, catalog);
    const meta = { startedAt: active.startedAt, duration, finishedAt: Date.now() };
    setWorkouts({ ...workouts, [active.dateKey]: { ...day, meta } });
    setResult({
      date: active.dateKey, ...meta,
      tonnage: workoutTonnage(exercises), sets: totalSets(exercises),
      exercisesCount: exercises.length, muscles,
      exercises, catalog,
    });
    setActive(null);
    skipRest();
  }
  function getPreviousSets(exerciseName) {
    const keys = Object.keys(workouts).sort().reverse();
    const selTs = parseDateKey(selectedDate).getTime();
    for (const key of keys) {
      if (parseDateKey(key).getTime() >= selTs) continue;
      const day = workouts[key];
      if (!day) continue;
      const exs = day.exercises || (Array.isArray(day) ? day : []);
      const ex = exs.find(e => e.name === exerciseName);
      if (ex && ex.sets.length > 0) {
        const hasData = ex.sets.some(s => (s.weight > 0 || s.reps > 0 || s.min > 0 || s.km > 0 || s.sec > 0));
        if (hasData) return { date: key, sets: ex.sets, type: ex.type };
      }
    }
    return null;
  }
  function getExerciseHistory(exerciseName) {
    const keys = Object.keys(workouts).sort();
    const items = [];
    keys.forEach(key => {
      const day = workouts[key];
      if (!day) return;
      const exs = day.exercises || (Array.isArray(day) ? day : []);
      const ex = exs.find(e => e.name === exerciseName);
      if (ex && ex.sets.length > 0) {
        const hasData = ex.sets.some(s => (s.weight > 0 || s.reps > 0 || s.min > 0 || s.km > 0 || s.sec > 0));
        if (hasData) {
          const maxWeight = ex.type === EX_TYPE.STRENGTH
            ? Math.max(...ex.sets.map(s => s.weight || 0), 0) : 0;
          items.push({ date: key, sets: ex.sets, type: ex.type, tonnage: exerciseTonnage(ex), maxWeight });
        }
      }
    });
    return items;
  }
  function makeEmptySet(type) {
    if (type === EX_TYPE.CARDIO) return { id: uid(), min: 0, km: 0 };
    if (type === EX_TYPE.TIME) return { id: uid(), sec: 0 };
    return { id: uid(), weight: 0, reps: 0 };
  }
  function addExercisesToWorkout(items) {
    const newOnes = items.map(({ name, type }) => ({
      id: uid(), name, type,
      sets: [makeEmptySet(type)],
    }));
    setWorkouts({ ...workouts, [selectedDate]: { ...currentDay, exercises: [...currentWorkout, ...newOnes] } });
    setIsPickerOpen(false);
    vibrate(VIBRATE_MEDIUM, settings.vibration);
  }
  function addSet(exId) {
    const ex = currentWorkout.find(e => e.id === exId);
    if (!ex) return;
    const newSet = makeEmptySet(ex.type);
    scrollTargetRef.current = { exId, setId: newSet.id };
    vibrate(VIBRATE_LIGHT, settings.vibration);
    setWorkouts({ ...workouts,
      [selectedDate]: { ...currentDay,
        exercises: currentWorkout.map(e =>
          e.id === exId ? { ...e, sets: [...e.sets, newSet] } : e
        ) } });
  }
  function addSetToSuperset(exId) {
    const ex = currentWorkout.find(e => e.id === exId);
    if (!ex || !ex.supersetId) return addSet(exId);
    const groupMembers = currentWorkout.filter(e => e.supersetId === ex.supersetId);
    const newSets = {};
    groupMembers.forEach(m => { newSets[m.id] = makeEmptySet(m.type); });
    vibrate(VIBRATE_LIGHT, settings.vibration);
    setWorkouts({ ...workouts,
      [selectedDate]: { ...currentDay,
        exercises: currentWorkout.map(e => {
          if (newSets[e.id]) return { ...e, sets: [...e.sets, newSets[e.id]] };
          return e;
        }) } });
  }
  function duplicateSet(exId, setId) {
    const ex = currentWorkout.find(e => e.id === exId);
    if (!ex) return;
    const source = ex.sets.find(s => s.id === setId);
    if (!source) return;
    const newSet = { ...source, id: uid() };
    scrollTargetRef.current = { exId, setId: newSet.id };
    vibrate(VIBRATE_LIGHT, settings.vibration);
    setWorkouts({ ...workouts,
      [selectedDate]: { ...currentDay,
        exercises: currentWorkout.map(e => {
          if (e.id !== exId) return e;
          const idx = e.sets.findIndex(s => s.id === setId);
          const newSets = [...e.sets];
          newSets.splice(idx + 1, 0, newSet);
          return { ...e, sets: newSets };
        }) } });
  }
  function updateSet(exId, setId, field, value, startRestAfter = false) {
    setWorkouts({ ...workouts,
      [selectedDate]: { ...currentDay,
        exercises: currentWorkout.map(e =>
          e.id === exId ? { ...e, sets: e.sets.map(s => s.id === setId ? { ...s, [field]: value } : s) } : e
        ) } });
    if (startRestAfter && active && settings.restTimerEnabled) {
      startRest(exId, setId);
    }
  }
  function removeSet(exId, setId) {
    if (!confirm(t('delete_set_confirm'))) return false;
    vibrate(VIBRATE_LIGHT, settings.vibration);
    setWorkouts({ ...workouts,
      [selectedDate]: { ...currentDay,
        exercises: currentWorkout.map(e =>
          e.id === exId ? { ...e, sets: e.sets.filter(s => s.id !== setId) } : e
        ) } });
    return true;
  }
  function removeExercise(exId) {
    if (!confirm(t('delete_exercise_confirm'))) return false;
    vibrate(VIBRATE_MEDIUM, settings.vibration);
    setWorkouts({ ...workouts, [selectedDate]: { ...currentDay,
      exercises: currentWorkout.filter(e => e.id !== exId) } });
    return true;
  }
  function toggleCollapse(exId) {
    setCollapsed(prev => ({ ...prev, [exId]: !prev[exId] }));
  }
  function createSuperset(sourceExId, targetIds) {
    const supersetId = uid();
    setWorkouts({ ...workouts, [selectedDate]: { ...currentDay,
      exercises: currentWorkout.map(e =>
        e.id === sourceExId || targetIds.includes(e.id) ? { ...e, supersetId } : e
      ) } });
    setSupersetPicker(null);
    vibrate(VIBRATE_MEDIUM, settings.vibration);
  }
  function dissolveSuperset(exId) {
    const ex = currentWorkout.find(e => e.id === exId);
    if (!ex || !ex.supersetId) return;
    const ssId = ex.supersetId;
    setWorkouts({ ...workouts, [selectedDate]: { ...currentDay,
      exercises: currentWorkout.map(e =>
        e.supersetId === ssId ? { ...e, supersetId: undefined } : e
      ) } });
    setActionMenu(null);
  }
  function removeFromSuperset(exId) {
    setWorkouts({ ...workouts, [selectedDate]: { ...currentDay,
      exercises: currentWorkout.map(e =>
        e.id === exId ? { ...e, supersetId: undefined } : e
      ) } });
    setActionMenu(null);
  }
  function renameExercise(exId, newName) {
    if (!newName.trim()) return;
    setWorkouts({ ...workouts, [selectedDate]: { ...currentDay,
      exercises: currentWorkout.map(e =>
        e.id === exId ? { ...e, name: newName.trim() } : e
      ) } });
    setActionMenu(null);
  }
  function saveAsTemplate(name) {
    if (!name.trim() || currentWorkout.length === 0) return;
    const tpl = {
      id: uid(), name: name.trim(),
      exercises: currentWorkout.map(e => ({
        name: e.name, type: e.type,
        sets: e.sets.map(s => ({ weight: s.weight, reps: s.reps, min: s.min, km: s.km, sec: s.sec })),
      })),
    };
    setTemplates([...templates, tpl]);
    setSaveTplOpen(false);
  }
  function applyTemplate(tpl) {
    const newExercises = tpl.exercises.map(e => ({
      id: uid(), name: e.name, type: e.type,
      sets: e.sets.map(s => ({ ...s, id: uid() })),
    }));
    setWorkouts({ ...workouts, [selectedDate]: { ...currentDay,
      exercises: [...currentWorkout, ...newExercises] } });
    setTemplatesOpen(false);
  }
  function removeTemplate(id) { setTemplates(templates.filter(t => t.id !== id)); }
  const canSaveTpl = currentWorkout.length > 0 && !active;

  const groupedItems = useMemo(() => {
    const result = [];
    const processed = new Set();
    currentWorkout.forEach(ex => {
      if (processed.has(ex.id)) return;
      if (ex.supersetId) {
        const members = currentWorkout.filter(e => e.supersetId === ex.supersetId);
        members.forEach(m => processed.add(m.id));
        result.push({ type: 'superset', supersetId: ex.supersetId, members });
      } else {
        processed.add(ex.id);
        result.push({ type: 'single', exercise: ex });
      }
    });
    return result;
  }, [currentWorkout]);

  return (
    <>
      <div className="tabs">
        {currentWorkout.length > 0 && (
          <>
            <button className="tab-btn" onClick={() => setReportOpen(true)}
              title={t('coach_report')}>
              <Icon name="info" /> {t('coach_report')}
            </button>
            <button className="tab-btn" onClick={() => setShareDayOpen(true)}>
              <Icon name="share" />
            </button>
          </>
        )}
        <button className="tab-btn" onClick={() => setSaveTplOpen(true)}
          disabled={!canSaveTpl}
          style={{ opacity: canSaveTpl ? 1 : 0.4, cursor: canSaveTpl ? 'pointer' : 'not-allowed' }}>
          <Icon name="save" /> {t('save')}
        </button>
        <button className="tab-btn" onClick={() => setTemplatesOpen(true)}>
          {t('templates')} ({templates.length})
        </button>
      </div>

      {active && (
        <div className="timer-bar-wrap">
          <div className="timer-bar">
            <div className="timer-icon"><Icon name="flame" /></div>
            <div className="timer-info">
              <div className="timer-label">{t('workout_in_progress')}</div>
              <div className="timer-value">{fmtTimer(elapsed)}</div>
            </div>
            <button className="timer-stop" onClick={stopWorkout}>
              <Icon name="stop" /> {t('finish')}
            </button>
          </div>
        </div>
      )}

      <div className="calendar-nav">
        <button className="cal-nav-btn" onClick={() => setWeekOffset(weekOffset - 1)}>
          <Icon name="chevronLeft" />
        </button>
        <div className="cal-range">{rangeText}</div>
        <button className="cal-nav-btn" onClick={() => setWeekOffset(weekOffset + 1)} disabled={!canGoForward}>
          <Icon name="chevronRight" />
        </button>
      </div>

      <div className="calendar" ref={calendarRef}>
        {days.map(d => {
          const key = dateKey(d);
          const isActive = key === selectedDate;
          const isToday = key === todayKey;
          const day = workouts[key];
          const dayExs = day ? (day.exercises || (Array.isArray(day) ? day : [])) : [];
          const hasWorkout = dayExs.length > 0;
          const isFuture = key > todayKey;
          return (
            <div key={key}
              className={`day ${isActive ? 'active' : ''} ${isToday ? 'today' : ''}`}
              style={{ opacity: isFuture ? 0.5 : 1 }}
              onClick={() => setSelectedDate(key)}>
              <div className="wd">{weekdaysShort[d.getDay()]}</div>
              <div className="num">{d.getDate()}</div>
              <div className="dot" style={{ opacity: hasWorkout ? 1 : 0 }} />
            </div>
          );
        })}
      </div>

      <div className="page-title">
        {selectedDate === todayKey ? t('today') : selectedDate > todayKey ? t('plan') : t('workout')}
      </div>
      <div className="page-date">
        {selectedDateObj.toLocaleDateString(settings.language === 'en' ? 'en-US' : 'ru-RU',
          { day: 'numeric', month: 'long', weekday: 'long' })}
      </div>

      {currentWorkout.length === 0 ? (
        <div className="empty">
          <Icon name="dumbbell" className="icon-lg" />
          <div style={{ marginTop: 12 }}>{t('no_exercises')}</div>
          <div className="empty-hint">{active ? t('add_or_start_active') : t('add_or_start')}</div>
        </div>
      ) : (
        <div className="exercises">
          {groupedItems.map((item, idx) => {
            if (item.type === 'superset') {
              const isDragging = item.members.some(m => dragProps.draggingId === m.id);
              const isOver = dragProps.dragOverIndex === idx && !isDragging;
              return (
                <div key={item.supersetId}
                  style={{
                    borderTop: isOver ? '2px solid var(--accent)' : '2px solid transparent',
                    borderRadius: 16,
                    transition: 'border-top 0.15s',
                    display: 'flex', flexDirection: 'column', gap: 6,
                  }}>
                  {item.members.map((ex, mi) => {
                    const letter = String.fromCharCode(65 + mi);
                    const isLast = mi === item.members.length - 1;
                    return (
                      <div key={ex.id} data-drag-id={ex.id}
                        style={{
                          opacity: dragProps.draggingId === ex.id ? 0.85 : 1,
                          boxShadow: dragProps.draggingId === ex.id ? '0 16px 40px rgba(0,0,0,0.5)' : 'none',
                          borderRadius: 16,
                          position: 'relative',
                          zIndex: dragProps.draggingId === ex.id ? 100 : 1,
                          transition: dragProps.draggingId === ex.id ? 'none' : 'box-shadow 0.15s',
                        }}>
                        <ExerciseCard ex={ex}
                          supersetLetter={letter}
                          prev={getPreviousSets(ex.name)}
                          isCollapsed={!!collapsed[ex.id]}
                          onToggleCollapse={() => toggleCollapse(ex.id)}
                          dragHandlers={dragProps.getHandleHandlers(ex, idx)}
                          onOpenChart={() => setChartExercise(ex.name)}
                          onOpenMenu={() => setActionMenu({ exId: ex.id, exName: ex.name })}
                          onAddSet={() => addSetToSuperset(ex.id)}
                          isLastInSuperset={isLast}
                          hideAddButton={!isLast}
                          onDupSet={(setId) => duplicateSet(ex.id, setId)}
                          onUpdateSet={(setId, field, value, startRestAfter) => updateSet(ex.id, setId, field, value, startRestAfter)}
                          onRemoveSet={(setId) => removeSet(ex.id, setId)}
                          restState={restState}
                          getRemaining={getRemaining}
                          skipRest={skipRest}
                        />
                      </div>
                    );
                  })}
                </div>
              );
            }
            const ex = item.exercise;
            const isDragging = dragProps.draggingId === ex.id;
            const isOver = dragProps.dragOverIndex === idx && !isDragging;
            return (
              <div key={ex.id} data-drag-id={ex.id}
                style={{
                  opacity: isDragging ? 0.85 : 1,
                  boxShadow: isDragging ? '0 16px 40px rgba(0,0,0,0.5)' : 'none',
                  borderTop: isOver ? '2px solid var(--accent)' : '2px solid transparent',
                  borderRadius: 16,
                  transition: isDragging ? 'none' : 'box-shadow 0.15s',
                  position: 'relative',
                  zIndex: isDragging ? 100 : 1,
                }}>
                <ExerciseCard ex={ex}
                  prev={getPreviousSets(ex.name)}
                  isCollapsed={!!collapsed[ex.id]}
                  onToggleCollapse={() => toggleCollapse(ex.id)}
                  dragHandlers={dragProps.getHandleHandlers(ex, idx)}
                  onOpenChart={() => setChartExercise(ex.name)}
                  onOpenMenu={() => setActionMenu({ exId: ex.id, exName: ex.name })}
                  onAddSet={() => addSet(ex.id)}
                  onDupSet={(setId) => duplicateSet(ex.id, setId)}
                  onUpdateSet={(setId, field, value, startRestAfter) => updateSet(ex.id, setId, field, value, startRestAfter)}
                  onRemoveSet={(setId) => removeSet(ex.id, setId)}
                  restState={restState}
                  getRemaining={getRemaining}
                  skipRest={skipRest}
                />
              </div>
            );
          })}
        </div>
      )}

      <div className="bottom-bar">
        <button className="bar-btn add" onClick={() => setIsPickerOpen(true)}>
          <Icon name="plus" /> {t('add')}
        </button>
        {!active && <button className="bar-btn start" onClick={startWorkout}>
          <Icon name="play" /> {t('start')}
        </button>}
      </div>

      {isPickerOpen && (
        <ExercisePicker catalog={catalog} setCatalog={setCatalog}
          onAdd={addExercisesToWorkout} onClose={() => setIsPickerOpen(false)} />
      )}
      {chartExercise && (
        <ChartModal exerciseName={chartExercise}
          history={getExerciseHistory(chartExercise)}
          catalog={catalog}
          onClose={() => setChartExercise(null)} />
      )}
      {templatesOpen && (
        <TemplatesModal templates={templates} onApply={applyTemplate}
          onRemove={removeTemplate} onClose={() => setTemplatesOpen(false)} />
      )}
      {saveTplOpen && (
        <SaveTemplateModal onSave={saveAsTemplate} onClose={() => setSaveTplOpen(false)} />
      )}
      {(shareDayOpen || result) && (
        <WorkoutResultModal
          data={shareDayOpen
            ? buildDayShareData(selectedDate, currentWorkout, currentMeta, catalog, settings, t)
            : buildResultData(result, catalog, settings, t)}
          onClose={() => { setShareDayOpen(false); setResult(null); }}
        />
      )}
      {reportOpen && currentWorkout.length > 0 && (
        <WorkoutReportModal
          date={selectedDate}
          exercises={currentWorkout}
          meta={currentMeta}
          catalog={catalog}
          onClose={() => setReportOpen(false)}
        />
      )}

      {actionMenu && (
        <ActionMenu
          exercise={currentWorkout.find(e => e.id === actionMenu.exId)}
          currentWorkout={currentWorkout}
          t={t}
          onClose={() => setActionMenu(null)}
          onOpenChart={() => { setChartExercise(actionMenu.exName); setActionMenu(null); }}
          onRename={(newName) => renameExercise(actionMenu.exId, newName)}
          onDelete={() => { const ok = removeExercise(actionMenu.exId); if (ok) setActionMenu(null); }}
          onSuperset={() => { setSupersetPicker({ sourceExId: actionMenu.exId }); setActionMenu(null); }}
          onDissolve={() => dissolveSuperset(actionMenu.exId)}
          onRemoveFromSuperset={() => removeFromSuperset(actionMenu.exId)}
          hasSuperset={!!(currentWorkout.find(e => e.id === actionMenu.exId)?.supersetId)}
        />
      )}

      {supersetPicker && (
        <SupersetPicker
          sourceExId={supersetPicker.sourceExId}
          currentWorkout={currentWorkout}
          t={t}
          onClose={() => setSupersetPicker(null)}
          onConfirm={(targetIds) => createSuperset(supersetPicker.sourceExId, targetIds)}
        />
      )}
    </>
  );
}

/* ============ КАРТОЧКА УПРАЖНЕНИЯ ============ */
function ExerciseCard({ ex, prev, isCollapsed, onToggleCollapse, dragHandlers, onOpenChart, onOpenMenu, onAddSet, onDupSet, onUpdateSet, onRemoveSet, restState, getRemaining, skipRest, supersetLetter, isLastInSuperset, hideAddButton }) {
  const { settings } = useSettings();
  const t = useT();
  const exTonnage = exerciseTonnage(ex);
  const typeLabel = ex.type === EX_TYPE.CARDIO ? t('cardio')
    : ex.type === EX_TYPE.TIME ? t('time') : '';
  const translatedName = translateExercise(ex.name, settings.language);
  const units = settings.units;

  const restForThis = restState && restState.exerciseId === ex.id;
  const restRemaining = restForThis ? getRemaining() : 0;
  const restDone = restForThis && restState.done;

  return (
    <div className={`exercise-card ${ex.supersetId ? 'superset' : ''}`}>
      <div className="exercise-head">
        <div className="drag-handle" {...dragHandlers}>
          <Icon name="gripVertical" />
        </div>
        <div className="exercise-name" onClick={onOpenMenu}>
          {supersetLetter && <span className="superset-label">{supersetLetter}</span>}
          {translatedName}
          {typeLabel && <span className="exercise-type-badge">{typeLabel}</span>}
          <span className="chart-hint" onClick={(e) => { e.stopPropagation(); onOpenChart(); }}>
            <Icon name="chart" className="icon-sm" />
          </span>
        </div>
        {exTonnage > 0 && <div className="exercise-tonnage">{fmtNum(exTonnage)} кг</div>}
        <button className={`collapse-btn ${isCollapsed ? 'collapsed' : ''}`}
          onClick={onToggleCollapse}>
          <Icon name="chevronDown" />
        </button>
      </div>

      {!isCollapsed && (
        <>
          {prev && (
            <div className="prev-hint">
              {t('last_time')} ({parseDateKey(prev.date).toLocaleDateString(
                settings.language === 'en' ? 'en-US' : 'ru-RU',
                { day: 'numeric', month: 'short' })}):{' '}
              {prev.sets.filter(s => s.weight > 0 || s.reps > 0 || s.min > 0 || s.km > 0 || s.sec > 0)
                .map(s => ex.type === EX_TYPE.CARDIO ? `${s.min}${t('minutes')}×${fmtNum(displayDistance(s.km, units))}${distanceUnit(units)}`
                  : ex.type === EX_TYPE.TIME ? `${s.sec}${t('seconds')}`
                  : `${fmtNum(displayWeight(s.weight, units))}×${s.reps}`).join(' · ')}
            </div>
          )}
          {ex.sets.map((s, sIdx) => (
            <SetRow key={s.id} set={s} idx={sIdx} type={ex.type}
              onUpdate={onUpdateSet}
              onRemove={() => onRemoveSet(s.id)}
              onDup={() => onDupSet(s.id)}
            />
          ))}
          {restForThis && (
            <div className={`rest-timer ${restDone ? 'done' : ''}`} onClick={skipRest}>
              <Icon name={restDone ? 'checkmark' : 'timer'} className="icon-sm" />
              <span>{restDone ? t('rest_done') : fmtTimer(restRemaining)}</span>
              <span style={{ marginLeft: 'auto', opacity: 0.7, fontSize: 11 }}>{t('skip_rest')}</span>
            </div>
          )}
          {!hideAddButton && (
            <button className="link-btn" onClick={onAddSet}>
              <Icon name="plus" className="icon-sm" /> {t('add_set')}{isLastInSuperset && ex.supersetId ? ' (во все)' : ''}
            </button>
          )}
        </>
      )}
    </div>
  );
}

function SetRow({ set, idx, type, onUpdate, onRemove, onDup }) {
  const { settings } = useSettings();
  const t = useT();
  const swipeRef = useSwipeLeft(onRemove);
  const units = settings.units;

  function handleUpdate(field, value) {
    const safe = safeNum(value);
    let startRestAfter = false;
    if (field === 'reps' || field === 'sec' || field === 'km') {
      if (safe > 0) startRestAfter = true;
    }
    onUpdate(set.id, field, safe, startRestAfter);
  }

  return (
    <div className="set-row" ref={swipeRef} data-set-id={set.id}>
      <div className="set-num">{idx + 1}</div>
      {type === EX_TYPE.STRENGTH && (
        <>
          <input type="number" inputMode="decimal"
            placeholder={units === 'imperial' ? 'lb' : 'кг'}
            value={set.weight ? Math.round(displayWeight(set.weight, units) * 10) / 10 : ''}
            onChange={e => handleUpdate('weight', inputToKg(safeNum(e.target.value), units))} />
          <div className="times">×</div>
          <input type="number" inputMode="numeric" placeholder={t('set_reps_placeholder')}
            value={set.reps || ''}
            onChange={e => handleUpdate('reps', e.target.value)} />
        </>
      )}
      {type === EX_TYPE.CARDIO && (
        <>
          <input type="number" inputMode="decimal" placeholder={t('set_min_placeholder')}
            value={set.min || ''}
            onChange={e => handleUpdate('min', e.target.value)} />
          <div className="times">×</div>
          <input type="number" inputMode="decimal"
            placeholder={units === 'imperial' ? 'mi' : 'км'}
            value={set.km ? Math.round(displayDistance(set.km, units) * 100) / 100 : ''}
            onChange={e => handleUpdate('km', inputToKm(safeNum(e.target.value), units))} />
        </>
      )}
      {type === EX_TYPE.TIME && (
        <input type="number" inputMode="decimal" placeholder={t('set_sec_placeholder')}
          value={set.sec || ''}
          onChange={e => handleUpdate('sec', e.target.value)} />
      )}
      <button className="icon-btn" onClick={onDup} title={t('duplicate')}>
        <Icon name="copy" className="icon-sm" />
      </button>
    </div>
  );
}

/* ============ МЕНЮ ДЕЙСТВИЙ ============ */
function ActionMenu({ exercise, currentWorkout, t, onClose, onOpenChart, onRename, onDelete, onSuperset, onDissolve, onRemoveFromSuperset, hasSuperset }) {
  const [renameMode, setRenameMode] = useState(false);
  const [newName, setNewName] = useState(exercise ? exercise.name : '');
  const swipeRef = useSwipeDown(onClose);

  if (!exercise) return null;
  const othersCount = currentWorkout.filter(e => e.id !== exercise.id).length;

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" ref={swipeRef} onClick={e => e.stopPropagation()}>
        <div className="handle" />
        <h2 style={{ marginBottom: 4 }}>{exercise.name}</h2>
        <div style={{ color: 'var(--text-muted)', fontSize: 13, marginBottom: 20 }}>
          {t('action_menu')}
        </div>

        {renameMode ? (
          <div className="edit-row" style={{ marginBottom: 12 }}>
            <input value={newName}
              onChange={e => setNewName(e.target.value)}
              autoFocus              onKeyDown={e => { if (e.key === 'Enter') { onRename(newName); setRenameMode(false); } if (e.key === 'Escape') setRenameMode(false); }} />
            <button className="ok-btn" onClick={() => { onRename(newName); setRenameMode(false); }}>OK</button>
          </div>
        ) : (
          <>
            <button className="action-menu-item" onClick={onOpenChart}>
              <Icon name="chart" /> {t('open_chart')}
            </button>

            {othersCount > 0 && (
              <button className="action-menu-item" onClick={onSuperset}>
                <Icon name="link" /> {t('superset_create')}
              </button>
            )}

            {hasSuperset && (
              <>
                <button className="action-menu-item" onClick={onRemoveFromSuperset}>
                  <Icon name="unlink" /> {t('superset_remove')}
                </button>
                <button className="action-menu-item" onClick={onDissolve}>
                  <Icon name="unlink" /> {t('superset_dissolve')}
                </button>
              </>
            )}

            <button className="action-menu-item" onClick={() => setRenameMode(true)}>
              <Icon name="edit" /> {t('rename')}
            </button>

            <button className="action-menu-item danger" onClick={onDelete}>
              <Icon name="trash" /> {t('delete_exercise')}
            </button>
          </>
        )}

        <button className="btn-cancel" onClick={onClose} style={{ marginTop: 12 }}>{t('cancel')}</button>
      </div>
    </div>
  );
}

function SupersetPicker({ sourceExId, currentWorkout, t, onClose, onConfirm }) {
  const sourceEx = currentWorkout.find(e => e.id === sourceExId);
  const sourceSupersetId = sourceEx ? sourceEx.supersetId : null;
  const [selected, setSelected] = useState(() => {
    if (sourceSupersetId) {
      return currentWorkout.filter(e => e.supersetId === sourceSupersetId && e.id !== sourceExId).map(e => e.id);
    }
    return [];
  });
  const swipeRef = useSwipeDown(onClose);

  const candidates = currentWorkout.filter(e =>
    e.id !== sourceExId && (!e.supersetId || e.supersetId === sourceSupersetId)
  );

  function toggle(id) {
    if (selected.includes(id)) setSelected(selected.filter(x => x !== id));
    else setSelected([...selected, id]);
  }

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" ref={swipeRef} onClick={e => e.stopPropagation()}>
        <div className="handle" />
        <h2>{t('superset_choose')}</h2>

        {candidates.length === 0 ? (
          <div style={{ color: 'var(--text-muted)', padding: '20px 0', textAlign: 'center' }}>
            {t('superset_only_mine')}
          </div>
        ) : (
          <>
            {candidates.map(ex => (
              <button key={ex.id}
                className={`superset-check-item ${selected.includes(ex.id) ? 'selected' : ''}`}
                onClick={() => toggle(ex.id)}>
                <div className={`superset-check ${selected.includes(ex.id) ? 'on' : ''}`}>✓</div>
                <span style={{ flex: 1 }}>{ex.name}</span>
              </button>
            ))}
            <button className="btn-primary" style={{ marginTop: 12 }}
              disabled={selected.length === 0}
              onClick={() => onConfirm(selected)}>
              {t('superset_create')} ({selected.length + 1})
            </button>
          </>
        )}
        <button className="btn-cancel" onClick={onClose}>{t('cancel')}</button>
      </div>
    </div>
  );
}/* ============ ЗАМЕРЫ ============ */
function MeasuresTab() {
  const { settings, measureFields, setMeasureFields } = useSettings();
  const t = useT();
  const [measures, setMeasures] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [formData, setFormData] = useState({});
  const [selectedDate, setSelectedDate] = useState(dateKey(new Date()));
  const [chartField, setChartField] = useState(null);

  useEffect(() => {
    const m = localStorage.getItem(MEASURES_KEY);
    if (m) try { setMeasures(JSON.parse(m)); } catch {}
  }, []);
  useEffect(() => { localStorage.setItem(MEASURES_KEY, JSON.stringify(measures)); }, [measures]);

  const sorted = [...measures].sort((a, b) => b.date.localeCompare(a.date));

  function openNew() { setEditId(null); setFormData({}); setSelectedDate(dateKey(new Date())); setShowForm(true); }
  function openEdit(m) { setEditId(m.id); setFormData({ ...m.values }); setSelectedDate(m.date); setShowForm(true); }
  function saveMeasure() {
    const values = {};
    measureFields.forEach(f => {
      const v = Number(formData[f.key]);
      if (!isNaN(v) && v > 0) values[f.key] = v;
    });
    if (Object.keys(values).length === 0) { alert(t('values') + '?'); return; }
    if (editId) {
      setMeasures(measures.map(m => m.id === editId ? { ...m, date: selectedDate, values } : m));
    } else {
      const existing = measures.find(m => m.date === selectedDate);
      if (existing) {
        if (!confirm(t('date') + '? ' + t('save') + '?')) return;
        setMeasures(measures.map(m => m.id === existing.id ? { ...m, values } : m));
      } else {
        setMeasures([...measures, { id: uid(), date: selectedDate, values }]);
      }
    }
    setShowForm(false);
  }
  function removeMeasure(id) {
    if (!confirm(t('delete') + '?')) return false;
    setMeasures(measures.filter(m => m.id !== id));
    return true;
  }
  function getChartData(fieldKey) {
    return measures.filter(m => m.values[fieldKey] != null)
      .map(m => ({ date: m.date, value: m.values[fieldKey] }))
      .sort((a, b) => a.date.localeCompare(b.date));
  }

  return (
    <>
      <div className="tabs">
        <button className="tab-btn" onClick={openNew}>
          <Icon name="plus" /> {t('new_measure')}
        </button>
      </div>

      {sorted.length === 0 ? (
        <div className="empty">
          <Icon name="ruler" className="icon-lg" />
          <div style={{ marginTop: 12 }}>{t('measures_empty')}</div>
          <div className="empty-hint">{t('measures_hint')}</div>
        </div>
      ) : (
        <>
          <div className="chip-row">
            {measureFields.filter(f => measures.some(m => m.values[f.key] != null)).map(f => (
              <button key={f.key} className="chip" onClick={() => setChartField(f.key)}>
                <Icon name="chart" className="icon-sm" /> {f.label}
              </button>
            ))}
          </div>

          {sorted.map((m, idx) => {
            const prevM = sorted[idx + 1];
            return (
              <div key={m.id} className="measure-card">
                <div className="measure-date-row">
                  <div className="measure-date">
                    {parseDateKey(m.date).toLocaleDateString(
                      settings.language === 'en' ? 'en-US' : 'ru-RU',
                      { day: 'numeric', month: 'long', year: 'numeric' })}
                  </div>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <button className="icon-btn" onClick={() => openEdit(m)}><Icon name="edit" className="icon-sm" /></button>
                    <button className="icon-btn" onClick={() => removeMeasure(m.id)}><Icon name="trash" className="icon-sm" /></button>
                  </div>
                </div>
                <div className="measure-grid">
                  {measureFields.map(f => {
                    const val = m.values[f.key];
                    if (val == null) return null;
                    const prevVal = prevM?.values?.[f.key];
                    const diff = prevVal != null ? val - prevVal : null;
                    return (
                      <div key={f.key} className="measure-cell">
                        <div className="measure-cell-label">{f.label}</div>
                        <div className="measure-cell-value">
                          {val}<small>{f.unit}</small>
                          {diff != null && diff !== 0 && (
                            <span style={{ fontSize: 11, marginLeft: 6, fontWeight: 600,
                              color: diff > 0 ? 'var(--green)' : 'var(--red)' }}>
                              {diff > 0 ? '+' : ''}{diff.toFixed(1)}
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </>
      )}

      {showForm && (
        <MeasureFormModal editId={editId} formData={formData} setFormData={setFormData}
          selectedDate={selectedDate} setSelectedDate={setSelectedDate}
          onSave={saveMeasure} onClose={() => setShowForm(false)} />
      )}
      {chartField && (
        <MeasureChartModal field={measureFields.find(f => f.key === chartField)}
          data={getChartData(chartField)} onClose={() => setChartField(null)} />
      )}
    </>
  );
}

function FieldsManagerModal({ fields, setFields, onClose }) {
  const t = useT();
  const swipeRef = useSwipeDown(onClose);
  const [editingKey, setEditingKey] = useState(null);
  const [editName, setEditName] = useState('');
  const [editUnit, setEditUnit] = useState('');
  const [newFieldName, setNewFieldName] = useState('');
  const [newFieldUnit, setNewFieldUnit] = useState('');
  const [addMode, setAddMode] = useState(false);

  const dragProps = useLongPressDrag(fields, (fromIdx, toIdx) => {
    const newList = [...fields];
    const [moved] = newList.splice(fromIdx, 1);
    newList.splice(toIdx, 0, moved);
    setFields(newList);
  });

  function startEdit(f) { setEditingKey(f.key); setEditName(f.label); setEditUnit(f.unit); }
  function saveEdit() {
    if (!editingKey) return;
    const newName = editName.trim();
    const newUnit = editUnit.trim();
    if (!newName) { setEditingKey(null); return; }
    setFields(fields.map(f => f.key === editingKey ? { ...f, label: newName, unit: newUnit } : f));
    setEditingKey(null);
  }
  function deleteField(key) {
    if (!confirm(t('delete_field_confirm'))) return false;
    setFields(fields.filter(f => f.key !== key));
    return true;
  }
  function addField() {
    const name = newFieldName.trim();
    const unit = newFieldUnit.trim() || 'см';
    if (!name) return;
    const key = 'custom_' + uid().slice(0, 8);
    setFields([...fields, { key, label: name, unit }]);
    setNewFieldName('');
    setNewFieldUnit('');
    setAddMode(false);
  }

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" ref={swipeRef} onClick={e => e.stopPropagation()}>
        <div className="handle" />
        <h2>{t('fields')}</h2>

        {fields.length === 0 && !addMode && (
          <div style={{ color: 'var(--text-muted)', padding: '20px 0', textAlign: 'center' }}>
            {t('no_data')}
          </div>
        )}

        {fields.map((f, idx) => {
          if (editingKey === f.key) {
            return (
              <div key={f.key} className="edit-row" style={{ flexDirection: 'column', alignItems: 'stretch', padding: 12, gap: 8 }}>
                <input value={editName}
                  onChange={e => setEditName(e.target.value)}
                  placeholder={t('field_name')}
                  autoFocus
                  style={{ background: 'var(--bg-input)', borderRadius: 8, padding: '10px 12px' }} />
                <input value={editUnit}
                  onChange={e => setEditUnit(e.target.value)}
                  placeholder={t('unit_placeholder')}
                  style={{ background: 'var(--bg-input)', borderRadius: 8, padding: '10px 12px' }} />
                <div style={{ display: 'flex', gap: 8 }}>
                  <button className="btn-primary" style={{ margin: 0 }} onClick={saveEdit}>OK</button>
                  <button className="btn-cancel" onClick={() => setEditingKey(null)}>{t('cancel')}</button>
                </div>
              </div>
            );
          }
          const isDragging = dragProps.draggingId === f.key;
          const isOver = dragProps.dragOverIndex === idx && !isDragging;
          return (
            <div key={f.key} data-drag-id={f.key}
              style={{
                opacity: isDragging ? 0.85 : 1,
                boxShadow: isDragging ? '0 16px 40px rgba(0,0,0,0.5)' : 'none',
                borderTop: isOver ? '2px solid var(--accent)' : '2px solid transparent',
                borderRadius: 12, marginBottom: 6,
                transition: isDragging ? 'none' : 'box-shadow 0.15s',
                position: 'relative', zIndex: isDragging ? 100 : 1,
              }}>
              <FieldRow field={f}
                dragHandlers={dragProps.getHandleHandlers(f, idx)}
                onEdit={() => startEdit(f)}
                onDelete={() => deleteField(f.key)} />
            </div>
          );
        })}

        {addMode ? (
          <div style={{ background: 'var(--bg-card)', borderRadius: 12, padding: 12, marginTop: 8 }}>
            <input className="input" placeholder={t('field_name_placeholder')}
              value={newFieldName}
              onChange={e => setNewFieldName(e.target.value)}
              autoFocus
              onKeyDown={e => e.key === 'Enter' && addField()} />
            <input className="input" placeholder={t('unit_placeholder')}
              value={newFieldUnit}
              onChange={e => setNewFieldUnit(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && addField()} />
            <div style={{ display: 'flex', gap: 8 }}>
              <button className="btn-primary" style={{ margin: 0 }} onClick={addField}>{t('add')}</button>
              <button className="btn-cancel" onClick={() => { setAddMode(false); setNewFieldName(''); setNewFieldUnit(''); }}>{t('cancel')}</button>
            </div>
          </div>
        ) : (
          <button className="btn-dashed" style={{ marginTop: 8 }} onClick={() => setAddMode(true)}>
            <Icon name="plus" className="icon-sm" /> {t('add_field')}
          </button>
        )}

        <button className="btn-cancel" onClick={onClose} style={{ marginTop: 16 }}>{t('close')}</button>
      </div>
    </div>
  );
}

function MeasureChartModal({ field, data, onClose }) {
  const { settings } = useSettings();
  const t = useT();
  const swipeRef = useSwipeDown(onClose);
  if (data.length === 0) {
    return (
      <div className="modal-bg" onClick={onClose}>
        <div className="modal" ref={swipeRef} onClick={e => e.stopPropagation()}>
          <div className="handle" />
          <h2>{field.label}</h2>
          <div style={{ color: 'var(--text-muted)', padding: '20px 0', textAlign: 'center' }}>{t('no_data')}</div>
          <button className="btn-cancel" onClick={onClose}>{t('close')}</button>
        </div>
      </div>
    );
  }
  const values = data.map(d => d.value);
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min || 1;
  const W = 320, H = 160, PAD = 30;
  const innerW = W - PAD * 2;
  const innerH = H - PAD * 2;
  const points = data.map((d, i) => {
    const x = data.length === 1 ? PAD + innerW / 2 : PAD + (i / (data.length - 1)) * innerW;
    const y = PAD + innerH - ((d.value - min) / range) * innerH;
    return { x, y, ...d };
  });
  const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
  const first = data[0].value;
  const last = data[data.length - 1].value;
  const diff = last - first;

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" ref={swipeRef} onClick={e => e.stopPropagation()}>
        <div className="handle" />
        <h2>{field.label} ({field.unit})</h2>
        <div className="chart-stats">
          <div className="stat-box"><div className="stat-label">{t('chart_current')}</div><div className="stat-value">{last} {field.unit}</div></div>
          <div className="stat-box"><div className="stat-label">{t('chart_max')}</div><div className="stat-value">{max}</div></div>
          <div className="stat-box">
            <div className="stat-label">{t('chart_change')}</div>
            <div className="stat-value" style={{ color: diff > 0 ? 'var(--green)' : diff < 0 ? 'var(--red)' : 'var(--text-muted)' }}>
              {diff > 0 ? '+' : ''}{diff.toFixed(1)}
            </div>
          </div>
        </div>
        <div className="chart-wrap">
          <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }}>
            <line x1={PAD} y1={PAD} x2={PAD} y2={H - PAD} stroke="var(--border)" />
            <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke="var(--border)" />
            {points.length > 1 && <path d={pathD} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinecap="round" />}
            {points.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="4" fill="var(--accent)" stroke="var(--bg)" strokeWidth="2" />)}
            <text x={PAD - 6} y={PAD + 4} fill="var(--text-muted)" fontSize="10" textAnchor="end">{max}</text>
            <text x={PAD - 6} y={H - PAD + 4} fill="var(--text-muted)" fontSize="10" textAnchor="end">{min}</text>
          </svg>
        </div>
        <div className="section-label">{t('history')}</div>
        {data.slice().reverse().map((d, i) => (
          <div key={i} style={{ display: 'flex', justifyContent: 'space-between',
            padding: '8px 0', borderBottom: '1px solid var(--border)', fontSize: 14 }}>
            <span style={{ color: 'var(--text-muted)' }}>
              {parseDateKey(d.date).toLocaleDateString(
                settings.language === 'en' ? 'en-US' : 'ru-RU',
                { day: 'numeric', month: 'short', year: 'numeric' })}
            </span>
            <span style={{ fontWeight: 600 }}>{d.value} {field.unit}</span>
          </div>
        ))}
        <button className="btn-cancel" onClick={onClose} style={{ marginTop: 20 }}>{t('close')}</button>
      </div>
    </div>
  );
}

function ChartModal({ exerciseName, history, catalog, onClose }) {
  const { settings } = useSettings();
  const t = useT();
  const swipeRef = useSwipeDown(onClose);
  const [show1RM, setShow1RM] = useState(false);
  const type = history[0]?.type || EX_TYPE.STRENGTH;
  const isStrength = type === EX_TYPE.STRENGTH;
  const units = settings.units;

  function getValue(item) {
    if (isStrength) return item.maxWeight;
    if (type === EX_TYPE.TIME) return Math.max(...item.sets.map(s => Number(s.sec) || 0), 0);
    return Math.max(...item.sets.map(s => Number(s.min) || 0), 0);
  }
  const unit = isStrength ? (units === 'imperial' ? 'lb' : 'кг')
    : type === EX_TYPE.TIME ? 'сек' : 'мин';

  const records = useMemo(() => {
    if (history.length === 0) return null;
    let maxWeight = 0, maxWeightDate = null;
    let maxReps = 0, maxRepsDate = null;
    let maxTonnage = 0, maxTonnageDate = null;
    let best1RM = 0, best1RMDate = null, best1RMWeight = 0, best1RMReps = 0;
    history.forEach(h => {
      if (h.tonnage > maxTonnage) { maxTonnage = h.tonnage; maxTonnageDate = h.date; }
      if (h.type === EX_TYPE.STRENGTH) {
        h.sets.forEach(s => {
          const w = Number(s.weight) || 0;
          const r = Number(s.reps) || 0;
          if (w > maxWeight) { maxWeight = w; maxWeightDate = h.date; }
          if (r > maxReps) { maxReps = r; maxRepsDate = h.date; }
          const rm = calc1RM(w, r);
          if (rm > best1RM) { best1RM = rm; best1RMDate = h.date; best1RMWeight = w; best1RMReps = r; }
        });
      }
    });
    return { maxWeight, maxWeightDate, maxReps, maxRepsDate, maxTonnage, maxTonnageDate, best1RM, best1RMDate, best1RMWeight, best1RMReps };
  }, [history]);

  const values = history.map(getValue);
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const W = 320, H = 160, PAD = 30;
  const innerW = W - PAD * 2;
  const innerH = H - PAD * 2;
  const points = history.map((h, i) => {
    const v = getValue(h);
    const x = history.length === 1 ? PAD + innerW / 2 : PAD + (i / (history.length - 1)) * innerW;
    const y = PAD + innerH - ((v - min) / range) * innerH;
    return { x, y, v, ...h };
  });
  const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
  const first = values[0] || 0;
  const last = values[values.length - 1] || 0;
  const diff = last - first;

  function fmtDate(d) {
    return parseDateKey(d).toLocaleDateString(
      settings.language === 'en' ? 'en-US' : 'ru-RU',
      { day: 'numeric', month: 'short', year: 'numeric' });
  }

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" ref={swipeRef} onClick={e => e.stopPropagation()}>
        <div className="handle" />
        <h2>{translateExercise(exerciseName, settings.language)}</h2>
        {history.length === 0 ? (
          <div style={{ color: 'var(--text-muted)', padding: '20px 0', textAlign: 'center' }}>{t('chart_no_data')}</div>
        ) : (
          <>
            <div className="chart-stats">
              <div className="stat-box"><div className="stat-label">{t('chart_current')}</div>
                <div className="stat-value">{fmtNum(displayWeight(last, units))} {unit}</div></div>
              <div className="stat-box"><div className="stat-label">{t('chart_max')}</div>
                <div className="stat-value">{fmtNum(displayWeight(max, units))} {unit}</div></div>
              <div className="stat-box">
                <div className="stat-label">{t('chart_progress')}</div>
                <div className="stat-value" style={{ color: diff >= 0 ? 'var(--green)' : 'var(--red)' }}>
                  {diff >= 0 ? '+' : ''}{fmtNum(displayWeight(diff, units))} {unit}
                </div>
              </div>
            </div>
            <div className="chart-wrap">
              <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }}>
                <line x1={PAD} y1={PAD} x2={PAD} y2={H - PAD} stroke="var(--border)" />
                <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke="var(--border)" />
                {points.length > 1 && <path d={pathD} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinecap="round" />}
                {points.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="4" fill="var(--accent)" stroke="var(--bg)" strokeWidth="2" />)}
                <text x={PAD - 6} y={PAD + 4} fill="var(--text-muted)" fontSize="10" textAnchor="end">{fmtNum(displayWeight(max, units))}</text>
                <text x={PAD - 6} y={H - PAD + 4} fill="var(--text-muted)" fontSize="10" textAnchor="end">{fmtNum(displayWeight(min, units))}</text>
              </svg>
            </div>
            {records && isStrength && (
              <>
                <div className="section-label">
                  <Icon name="target" className="icon-sm" /> {t('personal_records')}
                </div>
                <div style={{ display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
                  <div className="stat-box" style={{ flex: '1 1 30%' }}>
                    <div className="stat-label">{t('record_max_weight')}</div>
                    <div className="stat-value">{fmtNum(displayWeight(records.maxWeight, units))} {unit}</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>{fmtDate(records.maxWeightDate)}</div>
                  </div>
                  <div className="stat-box" style={{ flex: '1 1 30%' }}>
                    <div className="stat-label">{t('record_max_reps')}</div>
                    <div className="stat-value">{records.maxReps}</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>{fmtDate(records.maxRepsDate)}</div>
                  </div>
                  <div className="stat-box" style={{ flex: '1 1 30%' }}>
                    <div className="stat-label">{t('record_max_tonnage')}</div>
                    <div className="stat-value">{fmtNum(records.maxTonnage)} кг</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>{fmtDate(records.maxTonnageDate)}</div>
                  </div>
                </div>
                <button className="btn-dashed" onClick={() => setShow1RM(!show1RM)}>
                  <Icon name={show1RM ? 'chevronDown' : 'chevronRight'} className="icon-sm" />
                  {show1RM ? t('hide_1rm') : t('show_1rm')}

function useShare() {
  const [sharing, setSharing] = useState(false);
  const ref = useRef(null);
  async function share(filename = 'reps-workout.png') {
    if (!ref.current) return;
    setSharing(true);
    try {
      const canvas = await html2canvas(ref.current, {
        backgroundColor: null, scale: 1, width: 1080, height: 1920, useCORS: true,
      });
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob) { alert('Error'); return; }
      const file = new File([blob], filename, { type: 'image/png' });
      const canShareFiles = navigator.canShare && navigator.canShare({ files: [file] });
      if (canShareFiles) {
        try { await navigator.share({ files: [file], title: 'Reps' }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } finally {
      setSharing(false);
    }
  }
  return { ref, sharing, share };
}

function WorkoutReportModal({ date, exercises, meta, catalog, onClose }) {
  const { settings } = useSettings();
  const t = useT();
  const swipeRef = useSwipeDown(onClose);
  const [copied, setCopied] = useState(false);

  const data = useMemo(() => {
    return buildDayShareData(date, exercises, meta, catalog, settings, t);
  }, [date, exercises, meta, catalog, settings, t]);

  const reportText = useMemo(() => {
    return buildWorkoutReportText(data, exercises, settings, t, catalog);
  }, [data, exercises, settings, t, catalog]);

  const dateObj = parseDateKey(date);
  const dateStr = dateObj.toLocaleDateString(
    settings.language === 'en' ? 'en-US' : 'ru-RU',
    { day: 'numeric', month: 'long', year: 'numeric' }
  );

  function handleDownload() {
    const safeDate = date.replace(/[^\d-]/g, '');
    downloadTextFile(reportText, `reps-report-${safeDate}.txt`);
  }

  async function handleShare() {
    await shareText(reportText, `Reps — ${dateStr}`);
  }

  async function handleCopy() {
    try {
      await navigator.clipboard.writeText(reportText);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch {
      shareText(reportText);
    }
  }

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" ref={swipeRef} onClick={e => e.stopPropagation()}>
        <div className="handle" />
        <h2>{t('coach_report')}</h2>
        <div style={{ color: 'var(--text-muted)', fontSize: 13, marginBottom: 16 }}>
          {dateStr}
        </div>

        <div className="report-preview">{reportText}</div>

        <button className="btn-primary" onClick={handleShare} style={{ marginBottom: 8 }}>
          <Icon name="share" /> {t('share_text')}
        </button>

        <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
          <button className="btn-cancel" onClick={handleDownload} style={{ flex: 1 }}>
            <Icon name="disk" /> {t('download_txt')}
          </button>
          <button className="btn-cancel" onClick={handleCopy} style={{ flex: 1 }}>
            <Icon name={copied ? 'checkmark' : 'copy'} /> {copied ? t('copied') : t('copy')}
          </button>
        </div>

        <button className="btn-cancel" onClick={onClose}>{t('close')}</button>
      </div>
    </div>
  );
}

/* ============ ВЫБОР УПРАЖНЕНИЙ ============ */
function ExercisePicker({ catalog, setCatalog, onAdd, onClose }) {
  const { settings } = useSettings();
  const t = useT();
  const [view, setView] = useState('categories');
  const [activeCategoryId, setActiveCategoryId] = useState(null);
  const [newCategoryName, setNewCategoryName] = useState('');
  const [newExerciseName, setNewExerciseName] = useState('');
  const [newExerciseType, setNewExerciseType] = useState(null);
  const [query, setQuery] = useState('');
  const [editing, setEditing] = useState(null);
  const [selected, setSelected] = useState([]);
  const [editCatName, setEditCatName] = useState(null);
  const activeCategory = catalog.find(c => c.id === activeCategoryId);
  const swipeRef = useSwipeDown(onClose);

  const catDragProps = useLongPressDrag(catalog, (fromIdx, toIdx) => {
    const newList = [...catalog];
    const [moved] = newList.splice(fromIdx, 1);
    newList.splice(toIdx, 0, moved);
    setCatalog(newList);
  });
  const activeExs = activeCategory ? activeCategory.exercises.map(name => ({ id: name })) : [];
  const exDragProps = useLongPressDrag(activeExs, (fromIdx, toIdx) => {
    if (!activeCategory) return;
    const newList = [...activeCategory.exercises];
    const [moved] = newList.splice(fromIdx, 1);
    newList.splice(toIdx, 0, moved);
    setCatalog(catalog.map(c => c.id === activeCategory.id ? { ...c, exercises: newList } : c));
  });

  function isSelected(name) { return selected.some(s => s.name === name); }
  function toggleSelect(name) {
    if (isSelected(name)) {
      setSelected(selected.filter(s => s.name !== name));
      vibrate(VIBRATE_LIGHT, settings.vibration);
    } else {
      const type = getExerciseType(name, catalog, activeCategory);
      setSelected([...selected, { name, type }]);
      vibrate(VIBRATE_MEDIUM, settings.vibration);
    }
  }
  function getExerciseType(name, cat, activeCat) {
    for (const c of catalog) {
      if (c.exercises.includes(name)) {
        if (c.customTypes && c.customTypes[name]) return c.customTypes[name];
        if (CARDIO_SECTIONS.includes(c.id)) return EX_TYPE.CARDIO;
        if (TIME_SECTIONS.includes(c.id)) return EX_TYPE.TIME;
        return EX_TYPE.STRENGTH;
      }
    }
    if (activeCat) {
      if (CARDIO_SECTIONS.includes(activeCat.id)) return EX_TYPE.CARDIO;
      if (TIME_SECTIONS.includes(activeCat.id)) return EX_TYPE.TIME;
    }
    return EX_TYPE.STRENGTH;
  }
  function addCategory() {
    const name = newCategoryName.trim();
    if (!name) return;
    const newCat = { id: uid(), name, exercises: [] };
    setCatalog([...catalog, newCat]);
    setActiveCategoryId(newCat.id);
    setNewCategoryName('');
    setView('exercises');
  }
  function addExerciseToCatalog() {
    const name = newExerciseName.trim();
    if (!name || !activeCategory) return;
    if (activeCategory.exercises.includes(name)) { alert('Already exists'); return; }
    const type = newExerciseType || EX_TYPE.STRENGTH;
    setCatalog(catalog.map(c =>
      c.id === activeCategory.id
        ? { ...c, exercises: [...c.exercises, name], customTypes: { ...(c.customTypes || {}), [name]: type } }
        : c
    ));
    setNewExerciseName('');
    setNewExerciseType(null);
    setView('exercises');
  }
  function removeExerciseFromCatalog(catId, exName) {
    if (!confirm(t('delete_exercise_from_catalog'))) return false;
    setCatalog(catalog.map(c =>
      c.id === catId ? { ...c, exercises: c.exercises.filter(e => e !== exName) } : c
    ));
    return true;
  }
  function startEdit(catId, oldName) { setEditing({ catId, oldName, newName: oldName }); }
  function saveEdit() {
    if (!editing) return;
    const newName = editing.newName.trim();
    if (!newName) { setEditing(null); return; }
    setCatalog(catalog.map(c =>
      c.id === editing.catId
        ? { ...c, exercises: c.exercises.map(e => e === editing.oldName ? newName : e) }
        : c
    ));
    setEditing(null);
  }
  function removeCategory(catId) {
    if (!confirm(t('delete_section_confirm'))) return false;
    setCatalog(catalog.filter(c => c.id !== catId));
    return true;
  }
  function renameCategory(catId, newName) {
    if (!newName.trim()) return;
    setCatalog(catalog.map(c => c.id === catId ? { ...c, name: newName.trim() } : c));
    setEditCatName(null);
  }
  function confirmAdd() {
    if (selected.length === 0) { onClose(); return; }
    onAdd(selected);
  }

  const SelectionFooter = () => selected.length > 0 ? (
    <div className="picker-actions">
      <button className="btn-cancel" onClick={() => setSelected([])}>
        {t('cancel')} ({selected.length})
      </button>
      <button className="btn-primary" onClick={confirmAdd}>
        {t('add_selected')} ({selected.length})
      </button>
    </div>
  ) : null;

  if (view === 'categories') {
    return (
      <div className="modal-bg" onClick={onClose}>
        <div className={`modal ${selected.length > 0 ? 'has-picker-actions' : ''}`}
          ref={swipeRef} onClick={e => e.stopPropagation()}>
          <div className="handle" />
          <h2>{t('choose_category')}</h2>
          <input className="search-input" placeholder={t('search_all')}
            value={query} onChange={e => setQuery(e.target.value)} />
          {query.trim() ? (
            <>
              <SearchResults catalog={catalog} query={query} editing={editing}
                isSelected={isSelected} onToggleSelect={toggleSelect}
                setEditing={setEditing}
                onRemove={removeExerciseFromCatalog} onStartEdit={startEdit} onSaveEdit={saveEdit} />
              <SelectionFooter />
            </>
          ) : (
            <>
              {catalog.map((cat, idx) => (
                <CategoryRow key={cat.id}
                  cat={cat} idx={idx}
                  dragProps={catDragProps}
                  isEditing={editCatName && editCatName.id === cat.id}
                  editCatName={editCatName}
                  setEditCatName={setEditCatName}
                  onRename={(name) => renameCategory(cat.id, name)}
                  onOpen={() => { setActiveCategoryId(cat.id); setView('exercises'); }}
                  onDelete={() => removeCategory(cat.id)}
                  settings={settings}
                />
              ))}
              <button className="btn-dashed" onClick={() => setView('newCategory')} style={{ marginTop: 8 }}>
                <Icon name="plus" className="icon-sm" /> {t('create_category')}
              </button>
              <SelectionFooter />
            </>
          )}
        </div>
      </div>
    );
  }

  if (view === 'exercises' && activeCategory) {
    return (
      <div className="modal-bg" onClick={onClose}>
        <div className={`modal ${selected.length > 0 ? 'has-picker-actions' : ''}`}
          ref={swipeRef} onClick={e => e.stopPropagation()}>
          <div className="handle" />
          <button className="back-btn" onClick={() => { setView('categories'); setEditing(null); }}>
            <Icon name="chevronLeft" className="icon-sm" /> {t('all_categories')}
          </button>
          {editCatName && editCatName.id === activeCategory.id ? (
            <div className="edit-row" style={{ marginBottom: 16 }}>
              <input value={editCatName.name}
                onChange={e => setEditCatName({ ...editCatName, name: e.target.value })}
                onKeyDown={e => {
                  if (e.key === 'Enter') renameCategory(activeCategory.id, editCatName.name);
                  if (e.key === 'Escape') setEditCatName(null);
                }}
                autoFocus />
              <button className="ok-btn" onClick={() => renameCategory(activeCategory.id, editCatName.name)}>OK</button>
            </div>
          ) : (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 16 }}>
              <h2 style={{ margin: 0, flex: 1 }}>{translateExercise(activeCategory.name, settings.language)}</h2>
              <button className="icon-btn" onClick={() => setEditCatName({ id: activeCategory.id, name: activeCategory.name })}>
                <Icon name="edit" />
              </button>
            </div>
          )}
          {activeCategory.exercises.map((name, idx) => (
            <ExerciseRow key={name}
              name={name} idx={idx}
              dragProps={exDragProps}
              editing={editing && editing.catId === activeCategory.id ? editing : null}
              setEditing={setEditing}
              isSelected={isSelected(name)}
              onToggleSelect={() => toggleSelect(name)}
              onSaveEdit={saveEdit}
              onStartEdit={() => startEdit(activeCategory.id, name)}
              onDelete={() => removeExerciseFromCatalog(activeCategory.id, name)}
              settings={settings}
            />
          ))}
          <button className="btn-dashed" onClick={() => setView('newExercise')} style={{ marginTop: 12 }}>
            <Icon name="plus" className="icon-sm" /> {t('add_exercise')}
          </button>
          <button className="btn-cancel"
            onClick={() => { if (removeCategory(activeCategory.id) !== false) setView('categories'); }}
            style={{ marginTop: 8, color: 'var(--red)' }}>{t('delete_category')}</button>
          <SelectionFooter />
        </div>
      </div>
    );
  }

  if (view === 'newCategory') {
    return (
      <div className="modal-bg" onClick={onClose}>
        <div className="modal" ref={swipeRef} onClick={e => e.stopPropagation()}>
          <div className="handle" />
          <button className="back-btn" onClick={() => setView('categories')}>
            <Icon name="chevronLeft" className="icon-sm" /> {t('back')}
          </button>
          <h2>{t('new_category')}</h2>
          <input className="input" placeholder="Например, Ягодицы"
            value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} autoFocus
            onKeyDown={e => e.key === 'Enter' && addCategory()} />
          <button className="btn-primary" onClick={addCategory}>{t('create_category')}</button>
        </div>
      </div>
    );
  }

  if (view === 'newExercise' && activeCategory) {
    return (
      <div className="modal-bg" onClick={onClose}>
        <div className="modal" ref={swipeRef} onClick={e => e.stopPropagation()}>
          <div className="handle" />
          <button className="back-btn" onClick={() => setView('exercises')}>
            <Icon name="chevronLeft" className="icon-sm" /> {t('back')}
          </button>
          <h2>{t('new_exercise')}</h2>
          <div className="section-label">{t('section')}: {translateExercise(activeCategory.name, settings.language)}</div>
          <input className="input" placeholder="Например, Жим лёжа"
            value={newExerciseName} onChange={e => setNewExerciseName(e.target.value)} autoFocus
            onKeyDown={e => e.key === 'Enter' && addExerciseToCatalog()} />
          <div className="section-label">{t('exercise_type')}</div>
          <div className="type-selector">
            <button className={`type-opt ${newExerciseType === null || newExerciseType === EX_TYPE.STRENGTH ? 'active' : ''}`}
              onClick={() => setNewExerciseType(EX_TYPE.STRENGTH)}><Icon name="dumbbell" className="icon-sm" /> {t('type_strength')}</button>
            <button className={`type-opt ${newExerciseType === EX_TYPE.CARDIO ? 'active' : ''}`}
              onClick={() => setNewExerciseType(EX_TYPE.CARDIO)}><Icon name="run" className="icon-sm" /> {t('type_cardio')}</button>
            <button className={`type-opt ${newExerciseType === EX_TYPE.TIME ? 'active' : ''}`}
              onClick={() => setNewExerciseType(EX_TYPE.TIME)}><Icon name="timer" className="icon-sm" /> {t('type_time')}</button>
          </div>
          <button className="btn-primary" onClick={addExerciseToCatalog}>{t('add')}</button>
        </div>
      </div>
    );
  }
  return null;
}

function CategoryRow({ cat, idx, dragProps, isEditing, editCatName, setEditCatName, onRename, onOpen, onDelete, settings }) {
  const swipeRef = useSwipeLeft(onDelete);
  const isDragging = dragProps.draggingId === cat.id;
  const isOver = dragProps.dragOverIndex === idx && !isDragging;

  if (isEditing) {
    return (
      <div className="edit-row" style={{ marginBottom: 8 }}>
        <input value={editCatName.name}
          onChange={e => setEditCatName({ ...editCatName, name: e.target.value })}
          onKeyDown={e => {
            if (e.key === 'Enter') onRename(editCatName.name);
            if (e.key === 'Escape') setEditCatName(null);
          }}
          autoFocus />
        <button className="ok-btn" onClick={() => onRename(editCatName.name)}>OK</button>
      </div>
    );
  }

  return (
    <div data-drag-id={cat.id}
      style={{
        opacity: isDragging ? 0.85 : 1,
        boxShadow: isDragging ? '0 16px 40px rgba(0,0,0,0.5)' : 'none',
        borderTop: isOver ? '2px solid var(--accent)' : '2px solid transparent',
        borderRadius: 14, marginBottom: 8,
        transition: isDragging ? 'none' : 'box-shadow 0.15s',
        position: 'relative', zIndex: isDragging ? 100 : 1,
      }}>
      <div className="category-item" ref={swipeRef}
        style={{ marginBottom: 0, padding: '8px 4px 8px 0', touchAction: 'pan-y', willChange: 'transform' }}>
        <div className="drag-handle" {...dragProps.getHandleHandlers(cat, idx)}>
          <Icon name="gripVertical" />
        </div>
        <span style={{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', textAlign: 'left', padding: '8px 0' }}
          onClick={onOpen}>
          {translateExercise(cat.name, settings.language)}
          <span className="count" style={{ float: 'right', marginTop: 4 }}>
            {cat.exercises.length}<Icon name="chevronRight" />
          </span>
        </span>
        <button className="ex-action-btn"
          onClick={(e) => { e.stopPropagation(); setEditCatName({ id: cat.id, name: cat.name }); }}>
          <Icon name="edit" className="icon-sm" />
        </button>
      </div>
    </div>
  );
}

function ExerciseRow({ name, idx, dragProps, editing, setEditing, isSelected, onToggleSelect, onSaveEdit, onStartEdit, onDelete, settings }) {
  const swipeRef = useSwipeLeft(onDelete);
  const isDragging = dragProps.draggingId === name;
  const isOver = dragProps.dragOverIndex === idx && !isDragging;

  if (editing && editing.oldName === name) {
    return (
      <div className="edit-row">
        <input value={editing.newName}
          onChange={e => setEditing({ ...editing, newName: e.target.value })}
          onKeyDown={e => { if (e.key === 'Enter') onSaveEdit(); if (e.key === 'Escape') setEditing(null); }}
          autoFocus />
        <button className="ok-btn" onClick={onSaveEdit}>OK</button>
      </div>
    );
  }

  return (
    <div data-drag-id={name}
      style={{
        opacity: isDragging ? 0.85 : 1,
        boxShadow: isDragging ? '0 16px 40px rgba(0,0,0,0.5)' : 'none',
        borderTop: isOver ? '2px solid var(--accent)' : '2px solid transparent',
        borderRadius: 12, marginBottom: 6,
        transition: isDragging ? 'none' : 'box-shadow 0.15s',
        position: 'relative', zIndex: isDragging ? 100 : 1,
      }}>
      <div className={`ex-item ${isSelected ? 'selected' : ''}`} ref={swipeRef}
        style={{ marginBottom: 0, paddingLeft: 4, touchAction: 'pan-y', willChange: 'transform' }}>
        <div className="drag-handle" {...dragProps.getHandleHandlers({ id: name }, idx)} style={{ marginRight: 2 }}>
          <Icon name="gripVertical" />
        </div>
        <div className={`ex-check ${isSelected ? 'on' : ''}`}
          onClick={onToggleSelect}>✓</div>
        <button className="ex-name-btn" onClick={onToggleSelect}>
          {translateExercise(name, settings.language)}
        </button>
        <button className="ex-action-btn" onClick={onStartEdit}>
          <Icon name="edit" className="icon-sm" />
        </button>
      </div>
    </div>
  );
}

function SearchResults({ catalog, query, editing, isSelected, onToggleSelect, setEditing, onRemove, onStartEdit, onSaveEdit }) {
  const { settings } = useSettings();
  const t = useT();
  const q = query.toLowerCase();
  const results = [];
  catalog.forEach(cat => {
    cat.exercises.forEach(ex => {
      const translated = translateExercise(ex, settings.language);
      if (ex.toLowerCase().includes(q) || translated.toLowerCase().includes(q)) {
        results.push({ cat, ex });
      }
    });
  });
  if (results.length === 0) {
    return <div style={{ color: 'var(--text-muted)', fontSize: 14, padding: '12px 0' }}>{t('nothing_found')}</div>;
  }
  return (
    <>
      <div className="section-label">{t('found')}: {results.length}</div>
      {results.map(({ cat, ex }) => (
        editing && editing.catId === cat.id && editing.oldName === ex ? (
          <div key={cat.id + ex} className="edit-row">
            <input value={editing.newName}
              onChange={e => setEditing({ ...editing, newName: e.target.value })}
              onKeyDown={e => { if (e.key === 'Enter') onSaveEdit(); if (e.key === 'Escape') setEditing(null); }}
              autoFocus />
            <button className="ok-btn" onClick={onSaveEdit}>OK</button>
          </div>
        ) : (
          <div key={cat.id + ex} className={`ex-item ${isSelected(ex) ? 'selected' : ''}`}>
            <div className={`ex-check ${isSelected(ex) ? 'on' : ''}`}
              onClick={() => onToggleSelect(ex)}>✓</div>
            <button className="ex-name-btn" onClick={() => onToggleSelect(ex)}>
              {translateExercise(ex, settings.language)}
              <span style={{ color: 'var(--text-muted)', fontSize: 12, marginLeft: 8 }}>
                {translateExercise(cat.name, settings.language)}
              </span>
            </button>
            <button className="ex-action-btn" onClick={() => onStartEdit(cat.id, ex)}>
              <Icon name="edit" className="icon-sm" />
            </button>
          </div>
        )
      ))}
    </>
  );
}

/* ============ РЕНДЕР ============ */
ReactDOM.createRoot(document.getElementById('app')).render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      self.addEventListener('install', e => e.skipWaiting());
      self.addEventListener('activate', e => self.clients.claim());
      self.addEventListener('fetch', e => {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(() => {});
  });
}
</script>
